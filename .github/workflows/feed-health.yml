name: Feed health

# Runs before the morning broadcast, not after it. 20:10 UTC is 04:10 in
# Malaysia — roughly an hour ahead of the 05:15 WhatsApp run, so if a feed died
# overnight you find out while there is still time to say something about it.
#
# A failing job emails whoever owns the repo automatically; that is the whole
# notification mechanism, no dashboard to remember to open.
on:
  schedule:
    - cron: '10 20 * * *'   # 04:10 MYT, 30 min after the data builder
  workflow_dispatch:          # run it by hand from the Actions tab any time
  push:
    paths:
      - 'tools/feed-health.mjs'
      - '.github/workflows/feed-health.yml'

permissions:
  contents: read
  issues: write               # needed only by the "open an issue" step below

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # global fetch, no dependencies to install

      - name: Check every upstream
        id: check
        env:
          # Override in repo Settings → Secrets and variables → Variables if the
          # Worker ever moves.
          ENSO_PROXY: ${{ vars.ENSO_PROXY || 'https://enso-proxy.standphoto.workers.dev' }}
          # Derived from the repo this workflow is IN, not hardcoded. A guessed
          # Pages URL produced a run where every committed file 404'd while the
          # data sat correctly in the repo two directories away. Override with
          # an ENSO_SITE repo variable only if Pages serves a custom domain.
          ENSO_SITE: ${{ vars.ENSO_SITE || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node tools/feed-health.mjs

      # Only fires when the step above exited non-zero. Reuses one issue per
      # outage instead of opening a new one every morning the feed stays down.
      - name: Open or update an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Feed health check failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily feed health check failed.\n\nRun log: ${run}\n\n`
              + `The job summary lists which feed, its age, and why. Remember that a\n`
              + `feed answering HTTP 200 is not the same as a feed working — check the\n`
              + `\`detail\` column for a fallback source or a notice page.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'feed-health'
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['feed-health']
              });
            }
