<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c4a6e">
<title>ENSO Monitor · 厄尔尼诺/拉尼娜监测</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<!-- iOS: uses its own apple-touch-icon (ignores manifest icons) -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ENSO">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f0f9ff; --card:#ffffff; --ink:#0f172a; --muted:#475569;
    --line:#e2e8f0; --warm:#dc2626; --cool:#2563eb; --neutral:#475569;
    --accent:#0c4a6e; --warm-bg:#fef2f2; --cool-bg:#eff6ff; --neutral-bg:#f8fafc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","WenQuanYi Zen Hei",
    "Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.5;padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:linear-gradient(135deg,#0c4a6e,#0e7490);color:#fff;
    padding:16px;
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  h1{font-size:18px;margin:0;font-weight:700}
  .sub{font-size:12px;opacity:.92;margin-top:2px}
  .hbtns{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .infobtn{
    background:none;border:none;padding:0;margin:0;color:#fff;opacity:.9;
    cursor:pointer;display:flex;align-items:center;line-height:0;
  }
  .infobtn:active{opacity:.6}
  .langbtn{
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;
    cursor:pointer;flex-shrink:0;
  }
  main{padding:14px;max-width:560px;margin:0 auto}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .status-hero{text-align:center;padding:22px 16px}
  .phase-badge{
    display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;
    padding:5px 14px;border-radius:999px;margin-bottom:10px;
  }
  .phase-warm{background:var(--warm-bg);color:var(--warm)}
  .phase-cool{background:var(--cool-bg);color:var(--cool)}
  .phase-neutral{background:var(--neutral-bg);color:var(--neutral)}
  .bignum{font-size:46px;font-weight:800;line-height:1;margin:6px 0}
  .bignum small{font-size:18px;font-weight:600;color:var(--muted)}
  .anomunit{font-size:13px;font-weight:600;color:var(--muted);margin:-2px 0 2px;
    letter-spacing:.02em}
  .iodhead{text-align:center;margin:8px 0 2px}
  .iodnum{font-size:34px;font-weight:800;line-height:1;margin:6px 0}
  .iodhead .anomunit{text-align:center}
  .iodsrc{font-weight:400;color:var(--muted)}
  .phase-label{font-size:17px;font-weight:700;margin-top:4px}
  .phase-desc{font-size:13px;color:var(--muted);margin-top:8px}
  .strength{font-size:13px;font-weight:600;margin-top:6px}
  .verdict{display:flex;align-items:center;justify-content:center;gap:8px;
    margin:20px -16px -22px;padding:13px 16px;font-size:14px;font-weight:700;
    line-height:1.35;border-top:1px solid;
    border-bottom-left-radius:14px;border-bottom-right-radius:14px}
  .verdict-i{font-size:17px;flex-shrink:0}
  .herolag{font-size:11.5px;line-height:1.6;color:var(--muted);margin:8px 14px 0;
    padding-top:8px;border-top:1px dashed var(--line)}
  .heroadv{font-size:12.5px;line-height:1.6;color:#92400e;margin:7px 14px 0}
  .heroadv .outdate{color:#b8860b;font-weight:400}
  .verdict-warm{background:#fef7ed;color:#9a3412;border-top-color:#fed7aa}
  .verdict-cool{background:#eff6ff;color:#1d4ed8;border-top-color:#bfdbfe}
  .verdict-neutral{background:#f1f5f9;color:#475569;border-top-color:#e2e8f0}
  .seas-plain{opacity:.85;font-size:11px}
  .k-sub{font-size:11px;color:#64748b;font-weight:400}
  .cardtitle{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;
    align-items:center;gap:7px}
  .cardtitle .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .cardhint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px;line-height:1.7}
  .card.stale .v{color:#94a3b8 !important}
  .stalebanner{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;
    padding:9px 11px;margin:0 0 10px;font-size:11.5px;line-height:1.55;color:#92400e}
  .stalebanner b{font-size:12.5px}
  .staledbg{font-family:monospace;font-size:10px;opacity:.8;display:inline-block;margin-top:4px}
  .offlinebar{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;
    padding:10px 14px;margin-bottom:12px;text-align:center;font-size:13px;
    font-weight:600;color:#92400e}
  .offlinebar span{display:block;font-size:11px;font-weight:400;margin-top:3px;opacity:.85}
  .iodage{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 11px;
    margin:10px 0 0;font-size:12.5px;line-height:1.6;color:#92400e}
  .iodneutral{background:#f8fafc;border:1px solid var(--line);border-left:3px solid #94a3b8;
    border-radius:0 8px 8px 0;padding:11px 13px;margin:8px 0 0;font-size:12.5px;
    line-height:1.6;color:#475569}
  .iodfail{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:11px 13px;
    margin:8px 0 0;font-size:12.5px;line-height:1.6;color:#b91c1c}
  .surgealert{background:#fef2f2;border:1.5px solid #f87171;border-radius:10px;
    padding:12px 14px;margin:12px 0 0;font-size:13px;font-weight:600;line-height:1.55;
    color:#b91c1c;box-shadow:0 1px 3px rgba(248,113,113,.2)}
  .monofficial{margin:10px 0 0;font-size:12px;line-height:1.6;color:#64748b;
    padding-top:8px;border-top:1px dashed var(--line)}
  .outsyn{margin:10px 0 0;font-size:25px;line-height:1.6;color:#334155;
    background:#f8fafc;border-radius:8px;padding:8px 10px}
  .outsyn .outdate{color:#94a3b8;font-size:18px}
  .mjowheelhome{margin:10px 0 2px;background:#f8fafc;
    border:1px solid var(--line);border-radius:10px;padding:6px}
  .mjowheelhome svg{width:100%;height:auto;display:block}
  .share-panel{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .share-head{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--ink)}
  .share-edit{width:100%;box-sizing:border-box;font:13px/1.6 -apple-system,'Microsoft YaHei',sans-serif;
    color:var(--ink);background:#f8fafc;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;resize:vertical;min-height:150px}
  .share-actions{display:flex;gap:10px;margin-top:12px}
  .share-actions .btn{flex:1;margin:0}
  /* ---- Info-guide overlay (full-screen, toggled) ---- */
  .help-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);
    z-index:200;display:none;align-items:flex-end;justify-content:center}
  .help-overlay.show{display:flex}
  .help-panel{background:var(--card);width:100%;max-width:560px;
    max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 -4px 24px rgba(15,23,42,.2)}
  .help-panel-head{display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:700;color:#0c4a6e;flex-shrink:0;
    background:var(--card)}
  .help-x{background:#f1f5f9;border:1px solid var(--line);border-radius:8px;
    width:32px;height:32px;font-size:15px;color:#0c4a6e;cursor:pointer;
    flex-shrink:0;line-height:1}
  .help-x:active{background:#e2e8f0}
  .help-panel-body{overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
  .help.help-panel-body > p{font-size:13px;line-height:1.6;margin:10px 0;color:var(--ink)}
  .help .hl-warm{color:#991b1b} .help .hl-cool{color:#1e40af}
  .help .hl-neutral{color:#475569}
  .help .nowline{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;
    padding:11px 12px;color:#0c4a6e;margin-top:14px}
  .help .helpdiv{height:1px;background:var(--line);margin:14px 0 4px}
  .help .helpnote{background:#f8fafc;border:1px solid var(--line);border-left:3px solid #94a3b8;
    border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#475569;margin:8px 0}
  .help .iodcredit{background:#f0fdf4;border:1px solid #bbf7d0;border-left:3px solid #16a34a;
    border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#166534;margin:8px 0}
  .help .maptitle{font-size:13px;font-weight:700;color:#0c4a6e;margin:14px 0 6px}
  .help .mapwrap{background:#f8fafc;border:1px solid var(--line);border-radius:10px;
    padding:8px}
  .help .ninomap{display:block;width:100%;height:auto}
  /* ---- Niño region map (real projection, canvas) ---- */
  .nmap{position:relative}
  /* pan-y, not none: a vertical swipe must still scroll the card list;
     horizontal drag is what rotates the map. */
  .ninocanvas{display:block;width:100%;border-radius:8px;background:#f8fafc;
    touch-action:pan-y}
  .mapfoot{display:flex;flex-direction:column;gap:7px;margin-top:7px}
  .mapctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .mapctl-z{gap:10px}
  .mapgap{width:6px}
  /* One segmented control, nowrap: the -/+ pair must never be split across
     lines, and each half needs a thumb-sized target. */
  .mapzoom{display:inline-flex;flex-wrap:nowrap;align-items:stretch;flex-shrink:0;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f1f5f9}
  .mapzoom .zbtn{border:0;border-radius:0;background:transparent;color:#334155;
    min-width:44px;min-height:34px;padding:0 12px;font-size:17px;font-weight:600;
    line-height:1;display:flex;align-items:center;justify-content:center}
  .mapzoom .zbtn:active{background:#dbe3ea}
  /* The card's map is a preview button. No touch-action override anywhere on
     it, so the page scrolls over it like it would over an image. */
  .nmapopen{display:block;width:100%;padding:0;border:0;background:transparent;
    cursor:pointer;position:relative;border-radius:8px;overflow:hidden}
  .nmapcue{position:absolute;right:8px;bottom:8px;font-size:11.5px;font-weight:600;
    line-height:1;padding:6px 10px;border-radius:999px;pointer-events:none;
    background:rgba(12,74,110,.88);color:#fff;box-shadow:0 1px 6px rgba(12,74,110,.3)}
  /* Fullscreen map. Here touch-action:none is simply correct -- there is
     nothing behind it that wants the gesture. */
  .nmapfull{position:fixed;inset:0;z-index:240;background:var(--card);
    display:none;flex-direction:column}
  .nmapfull.show{display:flex}
  .nmapfull-head{display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:700;color:#0c4a6e;flex-shrink:0;
    padding-top:calc(12px + env(safe-area-inset-top))}
  .nmapfull-canvas{flex:1 1 auto;min-height:0;position:relative;background:#f8fafc}
  .nmapfull-canvas .ninocanvas{width:100%;height:100%;border-radius:0;
    touch-action:none}
  /* Phone: one column, capped, scrollable as a last resort. */
  .nmapfull-ctl{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* Anything wider than a phone: pack the groups horizontally. Six stacked rows
     on a 1900px window overflowed the panel and turned it into a scroll box
     that had scrolled the projection buttons half out of view -- while the
     horizontal space sat empty. Nothing is capped or scrolled here; it fits. */
  /* Wider than a phone: a fixed GRID, not a wrapping row.
     Wrapping re-packs every time a control changes width -- the player and
     legend appearing, the date digits changing, play becoming pause -- so the
     buttons drifted around as you used them. Each group now owns a cell and
     stays in it; an absent block leaves its cell empty instead of pulling the
     others along. */
  @media (min-width:700px){
    .nmapfull-ctl{display:grid;align-items:center;
      grid-template-columns:max-content max-content 1fr;
      gap:8px 16px;max-height:none;overflow:visible}
    .mapctl-sst{display:contents}
    .nmapfull-ctl > *{min-width:0}
    #nctl-full        {grid-column:1;grid-row:1}
    .nmapfull-ctl .mapctl-z {grid-column:2 / 4;grid-row:1}
    .nmapfull-ctl .sstmode  {grid-column:1;grid-row:2}
    .nmapfull-ctl .sstplayer{grid-column:2;grid-row:2}
    .nmapfull-ctl .sstlegend{grid-column:3;grid-row:2;max-width:340px}
    .nmapfull-ctl .sststatus{grid-column:1 / 4;grid-row:3}
    .nmapfull-ctl .sstlong  {grid-column:1 / 4;grid-row:4}
    .nmapfull-ctl .sstseek{width:200px;flex:0 0 auto}
    .nmapfull-ctl #nread-full{margin-left:auto;text-align:right}
    /* Empty status/hint blocks must not reserve a line. */
    .nmapfull-ctl .sstnote:empty{display:none}
  }
  .nmapfull-canvas{min-height:120px}
  /* Nothing in the control panel may widen the panel past the screen. */
  .nmapfull-ctl{overflow-x:hidden}
  .nmapfull-ctl .mapctl{flex-wrap:wrap;min-width:0}
  .nmapfull-ctl .sstseek{min-width:0}
  .sstnote.bad{color:#b91c1c}
  .sstlbl{margin-left:0;margin-right:2px;font-weight:600;color:#334155;white-space:nowrap}
  .mapbtn:disabled{opacity:.45;cursor:default}
  body.nmap-locked{overflow:hidden}
  .mapctl-sst{gap:8px}
  .mapctl-sst:empty{display:none}
  .sstseek{flex:1;min-width:70px;accent-color:#0c4a6e;height:26px}
  /* Only the date stays on one line -- it is short, and a fixed width stops the
     legend beside it jumping every time the digits change. */
  .sstdate{margin-left:0;font-weight:600;color:#334155;white-space:nowrap;
    min-width:5.6em;text-align:right}
  .mapctl-sst{flex-direction:column;align-items:stretch;gap:7px}
  .sstlegend{display:flex;align-items:center;gap:7px;font-size:10.5px;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .sstlegend i{flex:1;height:10px;border-radius:3px;border:1px solid var(--line)}
  .sstnote{margin-left:0;white-space:normal;line-height:1.55}
  /* New-build bar. Fixed above everything, including the fullscreen map, so a
     deploy is never hidden behind whatever the user has open. */
  .swbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    z-index:300;display:flex;align-items:center;gap:10px;
    background:#0c4a6e;color:#fff;border-radius:12px;padding:11px 12px 11px 15px;
    box-shadow:0 4px 18px rgba(15,23,42,.28);font-size:13.5px;font-weight:600;
    max-width:560px;margin:0 auto}
  .swbar span{flex:1}
  .swbar button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    background:#fff;color:#0c4a6e;border:0;border-radius:8px;padding:8px 13px;
    min-height:34px;flex-shrink:0}
  .swbar button:disabled{opacity:.6}
  .swver{font-variant-numeric:tabular-nums;opacity:.75}
  /* While rotation is armed the canvas is visibly different -- otherwise the
     page not scrolling looks like the app has frozen. */
  .mapzoom .zlvl{display:flex;align-items:center;justify-content:center;
    min-width:46px;padding:0 6px;background:#fff;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .mapbtn{font:inherit;font-size:11.5px;line-height:1;padding:5px 8px;cursor:pointer;
    background:#f1f5f9;color:#334155;border:1px solid var(--line);border-radius:7px}
  .mapbtn.on{background:#0c4a6e;border-color:#0c4a6e;color:#fff}
  .mapbtn.zoom{min-width:30px;font-size:14px;font-weight:600;padding:3px 8px}
  .mapbtn:disabled{opacity:.38;cursor:default}
  .mapread{margin-left:auto;font-size:10.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:normal}
  .nregions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .nreg{border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center}
  .nreg.key{border-color:#f59e0b;background:#fffbeb}
  .nreg .rk{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .nreg .rv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.35}
  .nreg .rv.na{color:#94a3b8;font-weight:400}
  .maplegend{display:flex;gap:10px;align-items:center;justify-content:center;
    font-size:10.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .maplegend i{display:inline-block;width:16px;height:9px;border-radius:2px;
    vertical-align:-1px;margin-right:4px}
  .mapnote{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
  .wktrend{font-size:11.5px;color:var(--muted);margin:13px 0 -2px}
  .spark.spark-wk{height:50px;gap:2px}
  .spark.spark-wk + .axis-row{gap:2px}
  .help .outlook{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;
    padding:11px 12px;margin-top:10px}
  .help .outlook-h{font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px}
  .help .outlook p{font-size:12px;line-height:1.6;color:#78350f;margin:0 0 8px}
  .help .outlook a{font-size:12px;color:#0e7490;text-decoration:none;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted)}
  .row .v{font-weight:700;font-variant-numeric:tabular-nums}
  .v.warm{color:var(--warm)} .v.cool{color:var(--cool)} .v.neutral{color:var(--ink)}
  /* Diverging bar chart: every bar is measured from the ZERO line in the middle.
     Previously positive bars were stuck to the container's bottom edge and
     negative ones to its top edge, so the two signs hung off opposite sides of
     the box with no shared baseline — an El Niño bar and a La Niña bar of the
     same magnitude did not line up, and a lone positive bar looked like it was
     floating. */
  .spark{display:flex;align-items:stretch;gap:3px;height:62px;margin:8px 0 2px;position:relative}
  .spark .zeroline{position:absolute;left:0;right:0;top:50%;height:1px;
    background:#94a3b8;opacity:.5;pointer-events:none}
  .bar-cell{flex:1;position:relative}
  .bar{position:absolute;left:0;right:0;min-height:2px}
  .bar.up{bottom:50%;border-radius:2px 2px 0 0}   /* warm: grows up from zero */
  .bar.dn{top:50%;border-radius:0 0 2px 2px}      /* cool: grows down from zero */
  .axis-row{display:flex;gap:3px;margin-top:4px}
  .axis-row span{flex:1;display:flex;flex-direction:column;align-items:center;
    line-height:1.25;white-space:nowrap}
  .axis-row b{font-size:9px;font-weight:600;color:var(--muted)}
  .axis-row i{font-size:8px;font-style:normal;color:#64748b}
  .farm{background:linear-gradient(135deg,#fffbeb,#fef3c7);
    border-color:#fde68a}
  .farm .cardtitle .dot{background:#d97706}
  .farm p{font-size:13.5px;line-height:1.65;margin:7px 0;color:#78350f}
  .meta{font-size:11px;color:var(--muted);text-align:center;margin:4px 0 16px}
  .help .helpsrc{font-size:11px;color:var(--muted);line-height:1.7;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .help .helpsrc a{color:#0e7490;text-decoration:none}
  .help .qrbox{text-align:center;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line)}
  .help .qrtitle{font-size:13px;font-weight:700;color:#0c4a6e;margin-bottom:10px;
    font-family:inherit}
  .help .qrframe{display:inline-block;background:#fff;padding:10px;border-radius:10px;
    border:1px solid var(--line);width:160px;height:160px}
  .help .qrimg{display:block;width:100%;height:100%}
  .help .qrlink{display:block;margin-top:10px;font-size:12px;color:#0e7490;
    text-decoration:none;word-break:break-all;font-weight:400;font-family:inherit}

var D = Math.PI/180;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function wrap180(l){ return ((l+180)%360+360)%360-180; }

/* ---------- rotation (d3 convention: rotate([lon,lat])) ---------- */
function rot(lon,lat,dl,dp){
  var l=(lon+dl)*D, p=lat*D, cp=Math.cos(p);
  var x=Math.cos(l)*cp, y=Math.sin(l)*cp, z=Math.sin(p);
  var c=Math.cos(dp*D), s=Math.sin(dp*D);
  var x2=x*c+z*s, z2=z*c-x*s;
  return [Math.atan2(y,x2)/D, Math.asin(clamp(z2,-1,1))/D];
}
function unrot(lon,lat,dl,dp){
  var l=lon*D, p=lat*D, cp=Math.cos(p);
  var x=Math.cos(l)*cp, y=Math.sin(l)*cp, z=Math.sin(p);
  var c=Math.cos(-dp*D), s=Math.sin(-dp*D);
  var x2=x*c+z*s, z2=z*c-x*s;
  return [wrap180(Math.atan2(y,x2)/D-dl), Math.asin(clamp(z2,-1,1))/D];

    fwd: function(l,p){ l*=D; p*=D; var cp=Math.cos(p);

function densify(r, step){
  var p=[], x, y;
  function push(a,b){ p.push([wrap180(a),b]); }

  for (x=r.lonE; x> r.lonW; x-=step) push(x,r.latN);

// back on top of the box. side = +1 below, -1 above; rank pushes extra rows.
REGIONS[0].labLon = -80;  REGIONS[0].side =  1; REGIONS[0].rank = 1;  // 1+2
REGIONS[1].labLon = -118; REGIONS[1].side =  1; REGIONS[1].rank = 0;  // 3
REGIONS[2].labLon = -178; REGIONS[2].side =  1; REGIONS[2].rank = 0;  // 4
REGIONS[3].labLon = -145; REGIONS[3].side = -1; REGIONS[3].rank = 0;  // 3.4

var MARKS = [
  { lon:102.4, lat:3.2, col:'#0f766e', key:'mapMY', dy:1.4 },
  { lon:-68,   lat:-20, col:'#9a3412', key:'mapSA', dy:1.4 }
];

/* ---------- clipping ------------------------------------------------------
   Sutherland–Hodgman against a longitude strip, applied in the ROTATED frame.
   Two different limits, one implementation:
     |lon| <= 180 → the antimeridian seam on a flat map
     |lon| <=  90 → the visible hemisphere of an orthographic globe (the limb)
   Without this, a split polygon closes with a chord straight across the map.  */
function clipHalf(poly, sign, lim){
  var out=[], n=poly.length, i, a, b, ia, ib, t;
  if(!n) return out;
  for (i=0;i<n;i++){
    a=poly[i]; b=poly[(i+1)%n];
    ia = sign*a[0] <= sign*lim+1e-9;
    ib = sign*b[0] <= sign*lim+1e-9;
    if (ia) out.push(a);
    if (ia!==ib){ t=(lim-a[0])/(b[0]-a[0]); out.push([lim, a[1]+(b[1]-a[1])*t]); }
  }
  return out;
}
// The clipper returns only the endpoints of an edge lying along the clip line.
// On a globe that edge IS the limb and on Winkel it is a curved border, so a
// straight chord would cut the corner. Subdivide it.
function densifyEdge(poly, lim){
  var out=[], n=poly.length, i, a, b, steps, k;
  for (i=0;i<n;i++){
    a=poly[i]; b=poly[(i+1)%n];
    out.push(a);
    if (Math.abs(Math.abs(a[0])-lim)<1e-6 && Math.abs(a[0]-b[0])<1e-6){
      steps=Math.ceil(Math.abs(b[1]-a[1])/2);
      for (k=1;k<steps;k++) out.push([a[0], a[1]+(b[1]-a[1])*k/steps]);
    }
  }
  return out;
}
function cutRing(r, lim){
  var u=[], prev=null, off=0, i, lo, la, d, pieces=[], sh, q, shifts=[-360,0,360];
  for (i=0;i<r.length;i++){
    lo=r[i][0]; la=r[i][1];
    if (prev!==null){ d=lo-prev; if (d>180) off-=360; else if (d<-180) off+=360; }
    u.push([lo+off,la]); prev=lo;
  }
  for (i=0;i<shifts.length;i++){
    sh=shifts[i];
    q=u.map(function(pt){ return [pt[0]+sh, pt[1]]; });
    q=clipHalf(q,-1,-lim); if (q.length<3) continue;
    q=clipHalf(q, 1, lim);  if (q.length<3) continue;
    pieces.push(densifyEdge(q,lim));
  }
  return pieces;
}

/* ---------- colour ---------- */
// Anomaly -> tint. Saturates at +/-2 deg C rather than +/-3: weekly values
// rarely exceed 2.5, and on this app's pale theme a /3 ramp washed out into
// grey at the values that actually occur.
function ramp(a){
  var t=clamp(a/2,-1,1), u=1-Math.abs(t);
  if (t>=0) return [225, Math.round(210-140*t), Math.round(205-150*t)];
  return [Math.round(205-140*Math.abs(t)), Math.round(215-95*Math.abs(t)), 235];
}

/* ---------- instances ---------- */
var INST = {};                 // id -> view state
var DATA = { vals:null, stale:false, week:null };
var trFn = function(k){ return k; };
var langFn = function(){ return 'zh'; };

function inst(id){
  if (!INST[id]) INST[id] = { proj:'ortho', rot:[140,0], scale:1,
                              w:0, h:0, cx:0, cy:0, R:0, drag:null,
                              rotate:false };
  return INST[id];
}
// The EFFECTIVE latitude rotation. Read through this everywhere -- never
// V.rot[1] directly.
//
// A lon-only projection must be guaranteed flat no matter which setter last
// touched the state. Zeroing rot[1] in setProj was not enough: setView('my')
// sets [-108,-2], so choosing Malaysia after switching to E re-introduced a 2
// degree tilt, which in equirectangular bends the equator into a shallow sine
// wave about 4px deep. Gating at the point of USE means no setter can leak a
// tilt in, and the tilt is still remembered for O and W3 when you switch back.
function latOf(V){ return PROJ[V.proj].lonOnly ? 0 : V.rot[1]; }

function project(V, lon, lat){
  var r = rot(lon,lat,V.rot[0],latOf(V));
  var q = PROJ[V.proj].fwd(r[0], r[1]);
  if (!q) return null;
  return [V.cx+q[0]*V.R, V.cy+q[1]*V.R];
}

function trace(V, ctx, ring, open){
  var P=PROJ[V.proj], i, l, p, q, x, y, started=false, prev=null, pieces, piece, j;
  var r = ring.map(function(pt){ return rot(pt[0],pt[1],V.rot[0],latOf(V)); });
  if (open){                            // polylines: break, never close
    for (i=0;i<r.length;i++){
      l=r[i][0]; p=r[i][1];
      if (prev!==null && Math.abs(l-prev)>180) started=false;
      q=P.fwd(l,p);
      if (!q){ started=false; prev=l; continue; }
      x=V.cx+q[0]*V.R; y=V.cy+q[1]*V.R;
      if (started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started=true; }
      prev=l;
    }
    return;
  }
  pieces = cutRing(r, P.sphere ? 90 : 180);
  for (j=0;j<pieces.length;j++){
    piece=pieces[j];
    for (i=0;i<piece.length;i++){
      q=P.fwd(piece[i][0], piece[i][1]); if(!q) continue;
      x=V.cx+q[0]*V.R; y=V.cy+q[1]*V.R;
      if (i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
    }
    ctx.closePath();
  }
}

// Rendering is split in two because almost none of it changes between frames.
//
// The ocean, graticule, coastlines, region boxes and labels depend only on the
// VIEW -- they are identical for every frame of a time-lapse. Re-tracing them
// per tick cost ~35,000 path operations and pinned playback at 2.5 fps. They
// are now rendered once into two offscreen layers, cached on the same key as
// the inverse projection, and blitted. Only the SST field and its isotherm are
// recomputed per frame.
//
// Two layers, not one, because the field belongs BETWEEN them: the ocean and
// graticule sit under it, and the land paints over its coastline stair-steps.
var baseCache = {};      // id -> { key, under, over }
var dataVer = 0;         // bumped by setData, so box tints invalidate the cache

function layerCanvas(V){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var c = document.createElement('canvas');
  c.width = Math.round(V.w * dpr); c.height = Math.round(V.h * dpr);
  var g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c: c, g: g };
}

function buildBase(V){
  var P = PROJ[V.proj], i, r, a, c, e, q, fs;

  var U = layerCanvas(V), ctx = U.g;
  ctx.beginPath();
  if (P.sphere) ctx.arc(V.cx, V.cy, V.R, 0, 7);
  else { e = P.ext; ctx.rect(V.cx-e[0]/2*V.R, V.cy-e[1]/2*V.R, e[0]*V.R, e[1]*V.R); }
  ctx.fillStyle = '#e0f2fe'; ctx.fill();
  if (!P.fillWidth){ ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.save(); ctx.clip();
  ctx.beginPath();
  for (i=-180;i<=180;i+=30){ (function(lo){ var g2=[],la;
    for (la=-80;la<=80;la+=4) g2.push([lo,la]); trace(V,ctx,g2,true); })(i); }
  for (i=-60;i<=60;i+=30){ (function(la){ var g2=[],lo;
    for (lo=-180;lo<=180;lo+=4) g2.push([lo,la]); trace(V,ctx,g2,true); })(i); }
  ctx.strokeStyle='rgba(2,132,199,.18)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();

  var O = layerCanvas(V); ctx = O.g;
  ctx.save();
  ctx.beginPath();
  if (P.sphere) ctx.arc(V.cx, V.cy, V.R, 0, 7);
  else { e = P.ext; ctx.rect(V.cx-e[0]/2*V.R, V.cy-e[1]/2*V.R, e[0]*V.R, e[1]*V.R); }
  ctx.clip();

  ctx.beginPath();
  LAND.forEach(function(poly){ poly.forEach(function(flat){
    var g2=[], k; for (k=0;k<flat.length;k+=2) g2.push([flat[k],flat[k+1]]);
    trace(V,ctx,g2,false);
  }); });
  ctx.fillStyle='#cbd5e1'; ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=0.6; ctx.stroke();

  ctx.beginPath();
  (function(){ var g2=[],lo; for (lo=-180;lo<=180;lo+=3) g2.push([lo,0]);
    trace(V,ctx,g2,true); })();
  ctx.strokeStyle='rgba(2,132,199,.6)'; ctx.setLineDash([5,5]);
  ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);

  for (i=0;i<REGIONS.length;i++){
    r=REGIONS[i];
    a = (DATA.vals && !DATA.stale && typeof DATA.vals[r.id]==='number') ? DATA.vals[r.id] : null;
    c = (a!==null && !r.key) ? ramp(a) : null;
    ctx.beginPath(); trace(V,ctx,r.ring,false);
    if (c){ ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.60)'; ctx.fill(); }
    ctx.strokeStyle = r.key ? '#f59e0b' : '#475569';
    ctx.lineWidth   = r.key ? 2 : 1.2;
    if (r.key) ctx.setLineDash([7,4]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();

  var placed = [];
  ctx.textBaseline='middle';
  fs = Math.round(clamp(V.w/40, 10, 13));
  ctx.font='700 '+fs+'px system-ui,-apple-system,sans-serif';
  for (i=0;i<REGIONS.length;i++){
    r=REGIONS[i];
    var q0=project(V, r.labLon, 0); if (!q0) continue;
    var qa=project(V, r.labLon, r.latN), qb=project(V, r.labLon, r.latS), half=0;
    if (qa) half=Math.max(half, Math.abs(qa[1]-q0[1]));
    if (qb) half=Math.max(half, Math.abs(qb[1]-q0[1]));
    var dy=r.side * (half + 4 + fs*(0.8 + r.rank*1.2));
    place(ctx, placed, (r.id==='1+2' ? 'Niño 1+2' : 'Niño '+r.id),
          q0[0], q0[1]+dy, r.key ? '#92400e' : '#1e293b', 'center', fs);
  }
  fs = Math.round(clamp(V.w/46, 9, 12));
  ctx.font='600 '+fs+'px system-ui,-apple-system,sans-serif';
  for (i=0;i<MARKS.length;i++){
    q=project(V, MARKS[i].lon, MARKS[i].lat); if (!q) continue;
    ctx.beginPath(); ctx.arc(q[0],q[1],3.5,0,7);
    ctx.fillStyle=MARKS[i].col; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
    place(ctx, placed, trFn(MARKS[i].key), q[0], q[1]+MARKS[i].dy*fs,
          MARKS[i].col, 'center', fs);
  }
  return { key: baseKey(V), under: U.c, over: O.c };
}
function baseKey(V){ return viewKeyOf(V) + '|d' + dataVer; }
function viewKeyOf(V){
  return V.proj+'|'+V.rot[0].toFixed(2)+'|'+V.rot[1].toFixed(2)+'|'
       + V.scale.toFixed(3)+'|'+V.w+'x'+V.h;
}

function draw(id){
  var V=inst(id), cv=document.getElementById('nmap-'+id);
  if (!cv) return;
  var ctx=cv.getContext('2d'), b=baseCache[id], k=baseKey(V);
  if (!b || b.key !== k){ b = baseCache[id] = buildBase(V); }
  ctx.clearRect(0,0,V.w,V.h);
  ctx.drawImage(b.under, 0, 0, V.w, V.h);
  var sstBuf = paintSst(id, V);
  if (sstBuf){
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sstBuf, 0, 0, V.w, V.h);
    drawIso(ctx, V);
  }
  ctx.drawImage(b.over, 0, 0, V.w, V.h);
}

// Draw a label at (x,y), nudging it vertically until it clears everything
// already placed. If no offset is free the label is DROPPED, not overprinted --
// an unreadable pile of text is worse than a missing name.
function place(ctx, placed, s, x, y, col, align, fs){
  ctx.textAlign = align;
  var w = ctx.measureText(s).width, h = fs + 4;
  var x0 = align==='right' ? x-w : (align==='left' ? x : x-w/2);
  var cand = [0, h+2, -(h+2), 2*h+4, -(2*h+4)], i, j, p, r, hit;
  for (i=0;i<cand.length;i++){
    r = { x:x0-3, y:y+cand[i]-h/2, w:w+6, h:h };
    hit = false;
    for (j=0;j<placed.length;j++){
      p = placed[j];
      if (r.x < p.x+p.w && r.x+r.w > p.x && r.y < p.y+p.h && r.y+r.h > p.y){ hit=true; break; }
    }
    if (!hit){ placed.push(r); label(ctx, s, x, y+cand[i], col); return; }
  }
}
function label(ctx, s, x, y, col){
  ctx.lineWidth=3.5; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(s,x,y);
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}

function sizeTo(id){
  var V=inst(id), cv=document.getElementById('nmap-'+id);
  if (!cv || !cv.parentElement) return;
  var w=cv.parentElement.clientWidth || 320;
  // Fullscreen fills whatever height its container gives it. The preview
  // derives one from its width: Winkel/equirect need h >= ~0.61*w to fill the
  // width instead of leaving big side margins.
  var h=(id==='full' && cv.parentElement.clientHeight)
        ? cv.parentElement.clientHeight
        : Math.round(clamp(w*0.62, 200, 420));
  var dpr=Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width='100%'; cv.style.height=h+'px';
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  V.w=w; V.h=h; V.cx=w/2; V.cy=h/2;
  var e=PROJ[V.proj].ext;
  V.R = PROJ[V.proj].fillWidth
      ? (w/e[0]) * V.scale                              // flush to both edges
      : Math.min((w-12)/e[0], (h-12)/e[1]) * V.scale;   // fitExtent equivalent
  draw(id);
}

function bind(id){
  var cv=document.getElementById('nmap-'+id), V=inst(id);
  if (!cv || cv.__bound) return;
  cv.__bound=true;
  function pos(ev){
    var b=cv.getBoundingClientRect();
    return [ev.clientX-b.left, ev.clientY-b.top];
  }
  // A mouse never competes with page scrolling, so it always drags. A finger
  // only drags once rotation is switched on; otherwise we ignore it completely
  // and leave the gesture to the browser's scroller.
  // Only the fullscreen instance is ever bound, so gestures are unconditional.
  function touchBlocked(){ return false; }
  cv.addEventListener('pointerdown', function(ev){
    V.drag=pos(ev); cv.setPointerCapture(ev.pointerId); cv.style.cursor='grabbing';
  });
  function stop(){ V.drag=null; cv.style.cursor='grab'; }
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('pointermove', function(ev){
    var p=pos(ev), k, out=document.getElementById('nread-'+id), c;
    if (V.drag){
      ev.preventDefault();
      k=90/V.R;
      V.rot[0]=wrap180(V.rot[0]+(p[0]-V.drag[0])*k);
      // Tilt on the globe and on Winkel, which both hold up obliquely.
      // Equirectangular opts out via lonOnly -- see PROJ.equi.
      if (!PROJ[V.proj].lonOnly)
        V.rot[1]=clamp(V.rot[1]-(p[1]-V.drag[1])*k,-89,89);
      V.drag=p; draw(id);
    }
    if (out){
      c=PROJ[V.proj].inv((p[0]-V.cx)/V.R, (p[1]-V.cy)/V.R);
      if (c) c=unrot(c[0],c[1],V.rot[0],latOf(V));
      out.textContent = c
        ? (Math.abs(c[1]).toFixed(1)+'\u00B0'+(c[1]<0?'S':'N')+'  '
         + Math.abs(c[0]).toFixed(1)+'\u00B0'+(c[0]<0?'W':'E'))
        : '\u2014';
    }
  });
  // Wheel zoom (desktop). passive:false so preventDefault actually stops the
  // page scrolling under the cursor.
  cv.addEventListener('wheel', function(ev){
    ev.preventDefault();
    setScale(id, V.scale * (ev.deltaY<0 ? 1.12 : 1/1.12));
  }, {passive:false});

  // Pinch zoom (touch). Two active pointers -> track the distance between them.
  var pts = {}, pinch0 = 0, scale0 = 1;
  cv.addEventListener('pointerdown', function(ev){
    if (touchBlocked(ev)) return;
    pts[ev.pointerId]=[ev.clientX,ev.clientY];
    var k=Object.keys(pts);
    if (k.length===2){ V.drag=null; pinch0=dist(pts[k[0]],pts[k[1]]); scale0=V.scale; }
  });
  cv.addEventListener('pointermove', function(ev){
    if (!(ev.pointerId in pts)) return;
    pts[ev.pointerId]=[ev.clientX,ev.clientY];
    var k=Object.keys(pts);
    if (k.length===2 && pinch0>0){
      ev.preventDefault();
      setScale(id, scale0 * dist(pts[k[0]],pts[k[1]])/pinch0);
    }
  });
  function drop(ev){ delete pts[ev.pointerId]; if (Object.keys(pts).length<2) pinch0=0; }
  cv.addEventListener('pointerup', drop);
  cv.addEventListener('pointercancel', drop);

  // Leaving the canvas restores the hint, so a stale coordinate never sits
  // there looking like a current reading.
  cv.addEventListener('pointerleave', function(){
    var out=document.getElementById('nread-'+id);
    if (out) out.textContent = trFn('mapDragHint');
  });

  cv.style.cursor='grab';
}
function dist(a,b){ var dx=a[0]-b[0], dy=a[1]-b[1]; return Math.sqrt(dx*dx+dy*dy); }

/* ---------- public ---------- */
function ctlRow(id){
  function btn(k, lbl, act, on){
    return '<button type="button" class="mapbtn'+(on?' on':'')+'" data-'+k+'="'+act+'" '
      + 'onclick="NinoMap.'+(k==='proj'?'setProj':'setView')+"('"+id+"','"+act+"')"+'">'
      + lbl+'</button>';
  }
  return '<div class="mapctl" id="nctl-'+id+'">'
       + btn('proj','O','ortho',true) + btn('proj','E','equi') + btn('proj','W3','winkel')
       +'<span class="mapgap"></span>'
       + btn('view', trFn('mapViewPac'), 'pac', true)
       + btn('view', trFn('mapViewMY'),  'my')
     +'</div>'
     +'<div class="mapctl mapctl-z">'
       +'<span class="mapzoom">'
         +'<button type="button" class="mapbtn zbtn" data-zoom="-1" aria-label="'
           + trFn('mapZoomOut') + '" onclick="NinoMap.zoom(\''+id+'\',-1)">\u2212</button>'
         +'<span class="zlvl" id="nzoom-'+id+'" aria-hidden="true">1.0\u00d7</span>'
         +'<button type="button" class="mapbtn zbtn" data-zoom="1" aria-label="'
           + trFn('mapZoomIn') + '" onclick="NinoMap.zoom(\''+id+'\',1)">+</button>'
       +'</span>'
       +'<span class="mapread" id="nread-'+id+'">'+trFn('mapDragHint')+'</span>'
     +'</div>'
     +'<div class="mapctl mapctl-sst" id="nsst-'+id+'"></div>';
}

// Two tiers, as elsewhere in this app. Past SST_DEAD_DAYS the source is
// presumed broken and the field is withheld. Between FRESH and DEAD it is
// SHOWN but flagged: every frame carries its own date in the player, so a
// dated time-lapse cannot pretend to be today the way a bare number could.
var SST_FRESH_DAYS = 10, SST_DEAD_DAYS = 45;

// A tick changes only the frame index. Rebuilding innerHTML for that destroyed
// and recreated the range input mid-drag and re-parsed the legend gradient
// several times a second. Structural changes still go through sstRow().
var rowSig = {};
function sstTick(id){
  var s = SST.state();
  var sig = [s.visible, s.variable, s.n, s.playing,
             SST.ageDays()===null?'-':(SST.ageDays()>45?'d':SST.ageDays()>10?'a':'f')].join('|');
  if (rowSig[id] !== sig){ rowSig[id] = sig; sstRow(id); return; }
  var d = document.getElementById('nsstdate-'+id);
  if (d) d.textContent = s.date || '';
  var r = document.getElementById('nsstseek-'+id);
  if (r && String(r.value) !== String(s.i)) r.value = s.i;
}

function sstRow(id){
  var el = document.getElementById('nsst-'+id);
  if (!el) return;
  var s = SST.state(), age = SST.ageDays(), v = s.variable, isSst = (v === 'sst');
  rowSig[id] = [s.visible, s.variable, s.n, s.playing,
                age===null?'-':(age>45?'d':age>10?'a':'f')].join('|');
  var dead = (age !== null && age > SST_DEAD_DAYS);
  var aged = (age !== null && age > SST_FRESH_DAYS && !dead);
  // setVisible() mutates state AFTER we snapshotted it, so track visibility
  // locally -- otherwise the withheld branch still rendered the player from the
  // stale snapshot.
  if (dead && s.visible) SST.setVisible(false);
  var vis = s.visible && !dead;

  // The layer toggle and the variable buttons are ALWAYS rendered. They used to
  // sit inside the "have frames" and "not stale" branches, so switching
  // variable -- which clears the store by design -- emptied the whole row, and
  // a stale field replaced it with a warning. Either way every control
  // vanished and there was no way back to the other variable.
  // Two buttons, each carrying the thermometer so the pair needs no separate
  // "SST field" label above it -- that label said nothing the buttons did not.
  // Each one also switches itself off, so there is no third Off button either.
  function sbtn(key, lbl, active){
    return '<button type="button" class="mapbtn'+(active?' on':'')+'"'
      + (dead ? ' disabled' : '')
      +' onclick="NinoMap.SST.show(\''+key+'\')">\ud83c\udf21 '+trFn(lbl)+'</button>';
  }
  var status =
      dead   ? trFn('sstDead').replace('{d}', s.newest||'?').replace('{n}', age.toFixed(0))
    : !s.n   ? trFn('sstLoading')
    : aged   ? trFn('sstAged').replace('{d}', s.newest||'?').replace('{n}', age.toFixed(0))
             : '';
  var src = (status && s.source) ? ' \u00b7 ' + s.source : '';

  el.innerHTML =
     '<div class="mapctl sstmode">'
       + sbtn('anom', 'sstVarAnom',  vis && v === 'anom')
       + sbtn('sst',  'sstVarSst',   vis && v === 'sst')
     +'</div>'
   + '<div class="mapread sstnote sststatus'+(dead?' bad':'')+'">'+(status?status+src:'')+'</div>'
   + (vis && s.n
      ? '<div class="mapctl sstplayer">'

    if (!a || !b) continue;
    ctx.moveTo(V.cx + a[0]*V.R, V.cy + a[1]*V.R);
    ctx.lineTo(V.cx + b[0]*V.R, V.cy + b[1]*V.R);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.strokeStyle = '#7f1d1d';               ctx.lineWidth = 1.2; ctx.stroke();
}


/* ==========================================================================
   SST ANOMALY LAYER  —  time-lapse painting under the Niño boxes
   --------------------------------------------------------------------------
   SST is a SCALAR field, so there is nothing to advect: nullschool's drifting
   threads are particles following a VECTOR field (currents, wind). Animating a
   temperature field means stepping through dates, not moving anything.

   The cost is all in the inverse projection. Painting every pixel needs
   lon/lat for that pixel, and on Winkel that is a 40-iteration Newton solve --
   about 97,000 solves for a 390x250 canvas. Per frame that is roughly 2 fps.

   But the inverse depends only on the VIEW, never on the data. So it is solved
   once per view into a Float32Array and reused for every frame; a frame then
   costs one bilinear sample and a colour lookup per pixel. The cache is
   rebuilt on drag-END, not during a drag.
   ========================================================================== */
return { markup:markup, mount:mount, setProj:setProj, setView:setView, zoom:zoom,
         SST:SST, _paintSst:paintSst, sstRow:sstRow, sstTick:sstTick,
         openFull:openFull, closeFull:closeFull, fullShell:fullShell, ctlRow:ctlRow,
         setData:setData, setI18n:setI18n, resizeAll:resizeAll,
         REGIONS:REGIONS, _ramp:ramp, _cutRing:cutRing, _PROJ:PROJ,
         _rot:rot, _unrot:unrot, _view:inst };
})();
</script>

  helpItcz:   {zh:'🌍 赤道辐合带 (ITCZ)：这是地球上最多雨的一条带——南北半球的信风在赤道附近相遇、空气被迫上升，形成连绵的雷暴云带，是热带降雨的「总开关」。马来西亚就在 ITCZ 的活动范围内（约 1–7°N）。关键是：ITCZ 会随太阳南北移动，一年两次经过我们头顶——大约 3–5月 与 10–11月，这正是「季风过渡期」，也是我们一年中雷暴最猛、午后暴雨最多的时候。换句话说，过渡期的大雨，本质就是 ITCZ 正压在我们上方。',
               en:'🌍 Inter-Tropical Convergence Zone (ITCZ): the rainiest belt on Earth — where the trade winds of the two hemispheres meet near the equator, air is forced upward into a near-continuous band of thunderstorms. It is the master "switch" of tropical rainfall, and Malaysia sits right in its range (~1–7°N). The key point: the ITCZ migrates north and south with the sun, passing over us twice a year — roughly Mar–May and Oct–Nov. Those are the "inter-monsoon" periods, and our most thundery, afternoon-downpour time of year. In other words, the inter-monsoon heavy rain is essentially the ITCZ sitting overhead.'},
  helpItczNote:{zh:'ℹ️ ITCZ 没有单一的「每日数值」可以像 ENSO／IOD／MJO 那样直接显示，所以这里只作概念说明，不另设数据卡。其实你已经在间接追踪它了：季风状态、MJO、过渡期，都是 ITCZ 位置与强度的不同侧面。把上面几张卡一起看，就是在看 ITCZ 对本区的影响。',
               en:'ℹ️ The ITCZ has no single daily index to display the way ENSO/IOD/MJO do, so this is an explainer only — no separate data card. You are in fact already tracking it indirectly: the monsoon status, the MJO, and the inter-monsoon transitions are all different facets of where the ITCZ is and how strong it is. Reading the cards above together is reading the ITCZ\u2019s influence on our region.'},
  itczDiagTitle:{zh:'ITCZ 一年如何经过马来西亚', en:'How the ITCZ moves past Malaysia through the year'},
  itczLabelN: {zh:'7–8月：ITCZ 偏北（西南季风，半岛偏干）', en:'Jul–Aug: ITCZ to the north (SW monsoon, drier Peninsula)'},
  itczLabelMid:{zh:'3–5月 与 10–11月：ITCZ 过境（过渡期，雷暴最多）', en:'Mar–May & Oct–Nov: ITCZ overhead (inter-monsoon, most storms)'},
  itczLabelS: {zh:'12–2月：ITCZ 偏南（东北季风，东海岸大雨）', en:'Dec–Feb: ITCZ to the south (NE monsoon, east-coast rain)'},

  iodAged:    {zh:'⚠️ IOD 数值日期为 {m}，可能已过期，需检查更新。暂不显示农事建议。',
               en:'⚠️ IOD value is dated {m} and may be out of date — needs a check. Farm advice withheld until refreshed.'},
  helpIod:    {zh:'🌏 印度洋偶极 (IOD)：看印度洋东西两侧的海温差。负 IOD = 东侧（靠苏门答腊、离我们近）偏暖 → 本区偏湿、早上多雨；正 IOD = 东侧偏冷 → 本区偏干。门槛：≥ +0.4 为正，≤ −0.4 为负，中间为中性。IOD 常与厄尔尼诺／拉尼娜同向出现：负 IOD + 拉尼娜最湿，正 IOD + 厄尔尼诺最干。但两者并非绑定——IOD 也可能在 ENSO 中性时单独出现，所以值得单独追踪。数据来自澳洲气象局 (BOM) 的每周 IOD 指数。',
               en:'🌏 Indian Ocean Dipole (IOD): the east–west sea-temperature gradient across the Indian Ocean. Negative IOD = the eastern side (near Sumatra, close to us) is warmer → wetter here, often morning rain; positive IOD = cooler eastern side → drier here. Thresholds: ≥ +0.4 positive, ≤ −0.4 negative, in between neutral. IOD often lines up with El Niño/La Niña: negative IOD + La Niña is wettest, positive IOD + El Niño is driest. But they are not locked together — IOD can also occur on its own while ENSO is neutral, which is why it is worth tracking separately. The value comes from the Bureau of Meteorology (BOM) weekly IOD index.'},
  helpIodNote:{zh:'ℹ️ 关于「IOD 暂时无法取得」：与 NOAA 的厄尔尼诺数据不同，IOD 没有干净的机器可读数据源，我们是从 BOM 网页上抓取那句「IOD index is …」。如果哪天看到红色提示「暂时无法取得」，多数情况只是 BOM 改了网页措辞，抓取对不上了——这是程序「宁可不显示，也不给过期或乱猜的数字」的安全设计，不是系统坏了，也不是数据出错。厄尔尼诺部分完全不受影响，照常运作。看到这个提示时不用紧张，只需把那句话的新写法告诉开发者，改一行抓取规则即可。预计每隔几个月可能需要微调一次。',
               en:'ℹ️ About the "IOD temporarily unavailable" notice: unlike the NOAA El Niño data, IOD has no clean machine-readable feed, so we scrape the sentence "IOD index is …" from BOM\'s web page. If you ever see the red "temporarily unavailable" notice, it almost always just means BOM reworded their page so the scrape no longer matches. This is the app\'s safety design deliberately choosing to show nothing rather than a stale or guessed number — it is not a breakage and not bad data. The El Niño side is completely unaffected and keeps working. No need to worry when you see it: just send the developer BOM\'s new wording and it\'s a one-line fix. Expect this maybe once every few months.'},

  iodCredit:  {zh:'🙏 本 IOD 功能源自农友 Wei Jian 的提问——他注意到负 IOD 时本地早上常下雨、影响农活。谢谢他的宝贵反馈，让这个工具对大家更有用。',

  // --- plain-language helpers ---
  helpToggle: {zh:'这些数字是什么意思？', en:'What do these numbers mean?'},
  helpClose:  {zh:'收起说明', en:'Close explanation'},
  helpClose:  {zh:'收起说明', en:'Hide explanation'},
  helpIntro:  {zh:'这个 App 追踪太平洋赤道海面的温度，用来判断现在是 厄尔尼诺、拉尼娜，还是中性。这是影响马来西亚雨季旱季的大背景。',
               en:'This app tracks the temperature of the Pacific Ocean along the equator. That tells us whether we are in El Niño, La Niña, or Neutral — the big pattern behind Malaysia\u2019s wet and dry seasons.'},
  helpElnino: {zh:'厄尔尼诺 = 太平洋偏暖 → 马来西亚通常 偏干、少雨。要防旱、防火、留意花期。',
               en:'El Niño = Pacific warmer than usual → Malaysia is usually drier, less rain. Watch for drought, fire, and flowering.'},
  helpLanina: {zh:'拉尼娜 = 太平洋偏冷 → 马来西亚通常 偏湿、多雨。要防涝、防根病。',
               en:'La Niña = Pacific cooler than usual → Malaysia is usually wetter, more rain. Watch for floods and root disease.'},
  helpNeutral:{zh:'中性 = 不冷不暖 → 雨量接近常年，没有特别偏向。',
               en:'Neutral = not warm, not cool → rainfall close to normal, no strong tilt either way.'},
  helpNumber: {zh:'大数字 = 海温比正常 高几度（+）或低几度（−）。超过 +0.5 算厄尔尼诺，低于 −0.5 算拉尼娜，中间是中性。',
               en:'The big number = how many degrees the sea is above (+) or below (−) normal. Above +0.5 = El Niño, below −0.5 = La Niña, in between = Neutral.'},
  helpAnomaly: {zh:'「距平」是什么？= 跟 正常值的差，不是实际水温。例如海温 29°C、距平 +1.7，意思是「比这片海这个季节的常年平均 高 1.7 度」。正号 = 比正常暖（厄尔尼诺方向）；负号 = 比正常冷（拉尼娜方向）；接近 0 = 正常。注意：负号是「比正常冷」，不是说海水真的很冷 — 太平洋一直都很暖。「正常」是用 30 年（1991–2020）平均算出来的，所以新文件叫「9120」。',
                en:'What is "anomaly"? = the difference from normal, NOT the actual water temperature. E.g. sea = 29°C, anomaly = +1.7 means "1.7 degrees warmer than this patch\u2019s usual average for this season". Plus = warmer than normal (El Niño direction); minus = cooler than normal (La Niña direction); near 0 = normal. Note: minus means "cooler than normal", not that the water is actually cold — the Pacific is always warm. "Normal" is the 30-year (1991–2020) average, which is why the new file is called "9120".'},
  helpSeason:  {zh:'像 MAM、FMA 这种 = 三个月一组，用每个月的英文首字母。MAM = 三月-四月-五月（Mar-Apr-May），FMA = 二月-三月-四月（Feb-Mar-Apr）。每过一个月就往前推一格，所以差不多每月有一个新数字。',
               en:'Labels like MAM, FMA = a group of 3 months, using each month\u2019s first letter. MAM = Mar-Apr-May, FMA = Feb-Mar-Apr. It slides forward one month at a time, so there\u2019s a new value about every month.'},
  helpWhat34:  {zh:'Niño 3.4 = 太平洋赤道上 一块固定海域 的名字（在国际换日线附近，离马来西亚很远）。科学家选它，是因为它的海温最能反映厄尔尼诺／拉尼娜。旁边的数字不是实际水温，而是 比正常高或低几度。RONI 和「每周 Niño 3.4」看的是同一块海，但不是同一个算法：RONI 会先减去整个热带海洋（20°S–20°N）的平均升温，再取三个月平均（慢、稳、已扣除全球变暖）；每周值是最新一周的原始距平，什么都没扣（快、跳动、数字偏大）。所以两者在厉尔尼诺期间会差得很明显，这是正常的。',
               en:'Niño 3.4 = the name of a fixed patch of ocean on the equator in the central Pacific (near the date line, far from Malaysia). Scientists use it because its sea temperature best reflects El Niño / La Niña. The number beside it is NOT the actual water temperature — it\u2019s how many degrees above or below normal. RONI and "Weekly Niño 3.4" read the same patch of ocean but are not the same calculation: RONI first subtracts the average warming of the whole tropical ocean (20°S–20°N) and then averages three months (slow, steady, global warming removed); the weekly is the raw anomaly for the latest single week with nothing subtracted (fast, jumpy, and a bigger number). During El Niño the two will differ noticeably — that is expected.'},
  helpWalker: {zh:'❓ 那么远的海（约 12,500 公里外）怎么会影响我们？靠的是一条横跨太平洋的空气大环流——「沃克环流 (Walker Circulation)」。平常，我们旁边（印尼、马来西亚一带）的海最暖，暖海把空气加热、上升成云致雨——这是我们头顶的「湿引擎」。厄尔尼诺时，这块暖水东移到中太平洋，上升致雨的区域也跟着东移、离开我们；而空气环流是一个闭环：一头上升，另一头就要下沉。上升区东移后，下沉的一头正好压在马来西亚上方——下沉气流是干的，抑制成云，于是我们偏干。所以不是热「传」过来，而是我们和中太平洋是同一个跷跷板的两端：那头升（湿），我们这头就降（干）。拉尼娜则相反，我们偏湿。这种「远隔相关」叫 teleconnection。',
               en:'❓ How can an ocean that far away (~12,500 km) affect us? Through a giant loop of air spanning the Pacific — the Walker Circulation. Normally the ocean right beside us (around Indonesia and Malaysia) is the warmest; that warm water heats the air, which rises into clouds and rain — our overhead "wet engine." During El Niño, that warm pool shifts east to the central Pacific, and the rising, rainy zone follows it away from us. But the air loop is closed: where it rises on one side, it must sink on the other. With the rising branch shifted east, the sinking branch lands right over Malaysia — and sinking air is dry, suppressing clouds, so we lean drier. It isn\u2019t that heat travels here; it\u2019s that we and the central Pacific are two ends of the same see-saw: their end goes up (wet), our end goes down (dry). La Niña is the reverse — wetter for us. This link across distance is called a teleconnection.'},
  walkerTitle:{zh:'沃克环流：厄尔尼诺时为何我们偏干', en:'Walker Circulation: why El Niño leaves us drier'},
  walkerRise: {zh:'上升 · 多雨', en:'rising · rainy'},

  walkerWarm: {zh:'暖海东移 →', en:'warm water shifts east →'},
  walkerNormalNote:{zh:'平常（非厄尔尼诺）：暖海在我们这侧，上升致雨在马来西亚上方——我们偏湿。',
               en:'Normal (non-El Niño): the warm water is on our side and the rising, rainy branch sits over Malaysia — we lean wetter.'},
  helpRoni:    {zh:'RONI =「相对海洋尼诺指数」，NOAA 自 2026 年 2 月起的官方指标，取三个月平均、每月更新。判断大趋势看它；因为是季平均，它比现实慢约 6 周。详情见 ⓘ 说明。',
               en:'RONI = the Relative Oceanic Niño Index, NOAA official index since February 2026. A three-month mean, updated monthly. Read it for the big trend; because it is a seasonal average it runs about six weeks behind the present. Full explanation in the ⓘ guide.'},
  helpRoniWhy: {zh:'🌊 为什么是 RONI 而不是 ONI？整个热带海洋都在变暖。旧的 ONI 拿太平洋的海温和 30 年平均相比，于是把这份全球增温也算进了厉尔尼诺的强度里 —— 厉尔尼诺看起来偏强，拉尼娜看起来偏弱。RONI 先减去整个热带（20°S–20°N）的平均距平，只留下太平洋自己的异常 —— 而风与雨真正回应的正是这一部分。NOAA 气候预测中心（CPC）已于 2026 年 2 月改用 RONI 作为官方指标，澳洲 BOM 也在 2025 年 9 月做了同样的切换。代价是反应慢：它取三个月平均、每月才发一次，事件正在发展时一定会低估当下。所以看「现在」要把三样一起读：RONI（季节）、每周 Niño 3.4（最快）、以及 NOAA 官方展望（前瞻）。',
               en:'🌊 Why RONI and not ONI? The whole tropical ocean is warming. The old ONI compared Pacific sea temperature against a 30-year average, so that global warming got counted as El Niño strength — El Niños looked stronger and La Niñas weaker than the atmosphere actually felt them. RONI subtracts the tropical-wide (20°S–20°N) average first, leaving only the Pacific own anomaly — and that is the part the winds and rain respond to. NOAA Climate Prediction Center adopted RONI as its official index in February 2026, and Australia BOM made the same switch in September 2025. The cost is speed: it is a three-month mean published monthly, so while an event is developing it will always understate the present. Read three things together for the present: RONI (the season), the weekly Niño 3.4 (the fastest), and the NOAA outlook (what is ahead).'},

  sstVarAnom: {zh:'距平', en:'Anomaly'},
  sstVarSst:  {zh:'实测海温', en:'Actual SST'},
  sstNoteAnom:{zh:'距平＝比 1971–2000 年同期平均高多少。注意：本图的气候基准是 1971–2000，而上方 Niño 指数用的是 1991–2020，所以本图颜色会略偏暖 —— 看形状与走向，不要拿来读数值。',
               en:'Anomaly = departure from the 1971–2000 average. Note this field uses a 1971–2000 baseline while the Niño indices above use 1991–2020, so it reads slightly warmer. Read the shape, not the numbers.'},
  sstNoteSst: {zh:'实测海面温度。白线为 28°C 等温线 —— 暖池的边界。厄尔尼诺发展时它会一路向东推进；这条线的位置比颜色更能说明问题。',
               en:'Actual sea-surface temperature. The white line is the 28°C isotherm — the edge of the warm pool. As El Niño develops it marches east; the line’s position tells you more than the colours do.'},
  // --- hero: the lag, and the direction of travel ---
  heroLag:    {zh:'RONI 是三个月平均值，上面这个数字描述的是 {s}，比今天落后约 6 周。事件正在发展时，它一定会低估当下。最新一周的 Niño 3.4 见下方。',

function tr(k){ return (T[k] && T[k][LANG]) || k; }

/* ===================== PARSERS ===================== */
// RONI.ascii.txt / oni.ascii.txt : whitespace columns.
// RONI: SEAS YR ANOM      |  ONI: SEAS YR TOTAL ANOM
function parseSeasonal(text, anomCol){
  var lines = text.trim().split(/\r?\n/);
  var out = [];
  for (var i=1;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if (p.length < anomCol+1) continue;
    var seas = p[0], yr = p[1], anom = parseFloat(p[anomCol]);
    if (isNaN(anom)) continue;
    out.push({ seas:seas, yr:yr, anom:anom });
  }
  return out;
}
// NOAA ROMI (Real-time OLR MJO Index): columns are
//   year month day hour pc1 pc2 amplitude
// No header, no phase column. To match the standard WH04/RMM phase convention
// (which our wet/dry mapping assumes), NOAA specifies: RMM1 = ROMI_PC2,
// RMM2 = -ROMI_PC1. The phase is then atan2(RMM2,RMM1) split into 8 sectors;
// amplitude is unchanged by the rotation. (Transform + sector boundaries were
// verified against WH04 canonical phase-sector centres before shipping.)
function parseMJO(text){
  if (!text) return null;
  var lines = text.trim().split(/\r?\n/);
  var last = null;
  var track = [];                                // last ~40 valid days for the trail
  for (var i=0;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if (p.length < 7) continue;
    if (!/^\d{4}$/.test(p[0])) continue;        // skip non-data lines
    var year=parseInt(p[0],10), mon=parseInt(p[1],10), day=parseInt(p[2],10);
    // p[3] is hour (ignored). PC1, PC2, amplitude:
    var pc1=parseFloat(p[4]), pc2=parseFloat(p[5]), amp=parseFloat(p[6]);
    if (!isFinite(amp) || Math.abs(pc1)>90 || Math.abs(pc2)>90) continue; // missing flag
    if (isNaN(year)||isNaN(mon)||isNaN(day)) continue;
    var rmm1 = pc2, rmm2 = -pc1;                 // ROMI -> RMM convention
    var phase = rmmPhaseOf(rmm1, rmm2);
    last = { year:year, month:mon, day:day, rmm1:rmm1, rmm2:rmm2, phase:phase, amp:amp };
    track.push({ rmm1:rmm1, rmm2:rmm2, amp:amp });
    if (track.length > 40) track.shift();        // keep the most recent ~40 days
  }
  if (last) last.track = track;                  // history for the wheel's trail
  return last; // latest valid row (file is chronological)
}
// Standard WH04 RMM phase from (RMM1,RMM2): the vector angle split into 8 sectors.
function rmmPhaseOf(rmm1, rmm2){
  var deg = Math.atan2(rmm2, rmm1) * 180/Math.PI;
  if (deg < 0) deg += 360;
  if (deg>=180 && deg<225) return 1;
  if (deg>=225 && deg<270) return 2;
  if (deg>=270 && deg<315) return 3;
  if (deg>=315 && deg<360) return 4;
  if (deg>=0   && deg<45)  return 5;
  if (deg>=45  && deg<90)  return 6;
  if (deg>=90  && deg<135) return 7;
  return 8; // 135-180
}
//  (A) SST+anomaly pairs (8 numbers): "20JUN2026  22.1 0.4  25.3 0.7  27.6 1.4  28.9 0.9"
//  (B) anomaly-only (4 numbers):      "20JUN2026  0.4  0.7  1.4  0.9"
// The parser detects which by counting numbers, so it works either way.
function parseWeekly(text){
  var lines = text.trim().split(/\r?\n/);
  var rows = [];
  for (var i=0;i<lines.length;i++){
    var ln = lines[i].trim();
    // data lines start with a date like 20JUN2026
    if (!/^\d{1,2}[A-Za-z]{3}\d{4}/.test(ln)) continue;
    var date = ln.match(/^\d{1,2}[A-Za-z]{3}\d{4}/)[0];
    var rest = ln.slice(date.length);
    // Extract every signed decimal individually. CPC sometimes glues a negative
    // anomaly onto its SST with no space (e.g. "23.4-0.4"), so a plain
    // whitespace split would lose columns. This regex pulls each number.
    var nums = rest.match(/-?\d+\.?\d*/g);
    if (!nums) continue;
    nums = nums.map(parseFloat);
    var n12, n3, n34, n4;
    if (nums.length >= 8){
      // Format A: 4 region SST+anomaly pairs; anomalies at odd indices.
      // Column order in wksst9120.for is 1+2, 3, 3.4, 4 -- NOT the order used
      // by the monthly ERSST file (1+2, 3, 4, 3.4). Do not "tidy" this.
      n12 = nums[1]; n3 = nums[3]; n34 = nums[5]; n4 = nums[7];
    } else if (nums.length >= 4){
      // Format B: 4 anomalies only, in region order n12,n3,n34,n4.
      n12 = nums[0]; n3 = nums[1]; n34 = nums[2]; n4 = nums[3];
    } else {
      continue; // not a valid data row
    }
    rows.push({
      date:   date,
      ts:     weekTs(date),          // sortable timestamp
      nino12: n12,
      nino3:  n3,
      nino34: n34,
      nino4:  n4,
    });
  }
  // Guarantee chronological order regardless of any trailing/footer lines,
  // so weekly[length-1] is always the genuine most-recent week.
  rows.sort(function(a,b){ return a.ts - b.ts; });
  return rows;
}

// Convert a CPC week date like "27JAN2021" into a sortable timestamp.
var MONTHS = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function weekTs(d){
  var m = d.match(/^(\d{1,2})([A-Za-z]{3})(\d{4})$/);
  if (!m) return 0;
  var mon = MONTHS[m[2].toUpperCase()];
  if (mon === undefined) return 0;
  return new Date(parseInt(m[3],10), mon, parseInt(m[1],10)).getTime();
}

/* ===================== CLASSIFY ===================== */
function phaseOf(anom){
  if (anom >= THRESH) return 'warm';
  if (anom <= -THRESH) return 'cool';
  return 'neutral';
}
function strengthOf(anom){
  var a = Math.abs(anom);
  if (a < 0.5) return null;
  if (a < 1.0) return 'weak';
  if (a < 1.5) return 'moderate';
  if (a < 2.0) return 'strong';
  return 'verystrong';
}
// IOD phase from the DMI value. Standard thresholds: +/-0.4 deg C.
var IOD_THRESH = 0.4;
function iodPhaseOf(v){
  if (v >= IOD_THRESH) return 'pos';
  if (v <= -IOD_THRESH) return 'neg';
  return 'neu';
}
// Short month name in the current language for a 1-12 month number.
function monthName(m){
  var en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (LANG === 'zh') return m + '月';
  return en[m-1] || ('M'+m);
}
// MJO interpretation. Amplitude < 1 = weak/inactive (no usable signal).
var MJO_ACTIVE = 1.0;
// Which geographic region the MJO convection sits over, by phase (1-8).
function mjoRegionKey(phase){
  if (phase===1)            return 'mjoRegWHemAfr'; // W Hemisphere / Africa
  if (phase===2||phase===3) return 'mjoRegIndian';  // Indian Ocean
  if (phase===4||phase===5) return 'mjoRegMaritime';// Maritime Continent (us)
  if (phase===6||phase===7) return 'mjoRegWPac';    // Western Pacific
  return 'mjoRegPac';                               // phase 8: Pacific
}
// Effect on OUR region (Maritime Continent / Malaysia), by phase.
// Robust core: phases 3-5 enhance rain here; 7-8-1 suppress; 2 & 6 transition.
// Only meaningful when amplitude >= 1 (checked by caller).
function mjoEffect(phase){
  if (phase===3||phase===4||phase===5) return 'wet';
  if (phase===7||phase===8||phase===1) return 'dry';
  return 'transition'; // 2 or 6
}
function fmt(n){ return (n>=0?'+':'') + n.toFixed(2); }
// Format a cache timestamp as a short local date+time for the offline banner.
function fmtCacheTime(ms){
  try {
    var d = new Date(ms);
    var pad = function(x){ return (x<10?'0':'')+x; };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
      +' '+pad(d.getHours())+':'+pad(d.getMinutes());
  } catch(e){ return ''; }
}

/* ===================== DYNAMIC SITUATION TEXT ===================== */
// Builds the "right now" sentence entirely from the live numbers:
// the official RONI phase/strength, the latest weekly Nino 3.4, and the
// direction of travel. No forecast is invented here — the forward-looking
// NOAA outlook is a separate, clearly-labelled line (see helpOutlook).
function situationText(phase, strength, t3, roniVal, wkVal){
  var L = LANG;
  // 1) Headline state from official RONI
  var stateZh, stateEn;
  if (phase==='warm'){
    stateZh = '目前处于 厄尔尼诺' + (strength?'（'+tr(strength)+'）':'') + '，官方 RONI = '+fmt(roniVal)+'°C';
    stateEn = 'Currently El Niño' + (strength?' ('+tr(strength)+')':'') + ', official RONI = '+fmt(roniVal)+'°C';
  } else if (phase==='cool'){
    stateZh = '目前处于 拉尼娜' + (strength?'（'+tr(strength)+'）':'') + '，官方 RONI = '+fmt(roniVal)+'°C';
    stateEn = 'Currently La Niña' + (strength?' ('+tr(strength)+')':'') + ', official RONI = '+fmt(roniVal)+'°C';
  } else {
    stateZh = '目前 中性（不偏冷也不偏暖），官方 RONI = '+fmt(roniVal)+'°C';
    stateEn = 'Currently Neutral (neither warm nor cool), official RONI = '+fmt(roniVal)+'°C';
  }
  // 2) Direction of travel from the 3-season RONI trend
  var dirZh, dirEn;
  if (t3==='rising'){ dirZh='，并在 升温'; dirEn=', and warming'; }
  else if (t3==='falling'){ dirZh='，并在 降温'; dirEn=', and cooling'; }
  else { dirZh='，大致 平稳'; dirEn=', roughly steady'; }
  // 3) Latest weekly pulse — note if it disagrees with the slower seasonal state
  var wkPhase = phaseOf(wkVal);
  var pulseZh, pulseEn;
  if (wkPhase !== phase){
    // weekly leading the seasonal average — the telltale of a transition
    var leanZh = wkPhase==='warm'?'偏暖':wkPhase==='cool'?'偏冷':'中性';
    var leanEn = wkPhase==='warm'?'warm':wkPhase==='cool'?'cool':'neutral';
    pulseZh = '。最新一周的 Niño 3.4 = '+fmt(wkVal)+'°C（'+leanZh+'），比季节平均更快反映变化 — 这通常是 过渡期 的信号';
    pulseEn = '. The latest week\u2019s Niño 3.4 = '+fmt(wkVal)+'°C ('+leanEn+'), moving ahead of the seasonal average — usually a sign of a transition in progress';
  } else {
    pulseZh = '。最新一周的 Niño 3.4 = '+fmt(wkVal)+'°C，与季节状态一致';
    pulseEn = '. The latest week\u2019s Niño 3.4 = '+fmt(wkVal)+'°C, consistent with the seasonal state';
  }
  // 4) Plain farm takeaway tied to the OBSERVED phase (no forecast)
  var farmZh, farmEn;
  if (phase==='warm' || (phase==='neutral' && wkPhase==='warm')){
    farmZh = '。对果园：注意 偏干、防火、灌溉，留意花期窗口';
    farmEn = '. For the orchard: watch for drier conditions, fire risk, irrigation, and flowering windows';
  } else if (phase==='cool' || (phase==='neutral' && wkPhase==='cool')){
    farmZh = '。对果园：注意 偏湿、排水、根部病害';
    farmEn = '. For the orchard: watch for wetter conditions, drainage, and root disease';
  } else {
    farmZh = '。对果园：雨量接近常年，按常规季候管理';
    farmEn = '. For the orchard: rainfall near normal, manage by the usual seasonal calendar';
  }
  return (L==='zh')
    ? (stateZh + dirZh + pulseZh + farmZh + '。')
    : (stateEn + dirEn + pulseEn + farmEn + '.');
}

// Short, always-visible "second doctor" verdict under the big number.
// Uses the OBSERVED phase, and lets the weekly pulse tip a neutral state
// toward its leaning side (that's the real, actionable signal for a farmer).
// Returns {icon, text} in the active language. No forecast — observed only.
function plainVerdict(phase, wkPhase){
  var lean = phase;
  if (phase === 'neutral' && wkPhase !== 'neutral') lean = wkPhase; // transition tip
  if (lean === 'warm'){
    return { icon:'☀️', cls:'verdict-warm',
      text: (LANG==='zh')
        ? '偏干 — 准备灌溉、留意火患与花期'
        : 'Leaning drier — prepare irrigation, watch fire risk & flowering' };
  }
  if (lean === 'cool'){
    return { icon:'🌧️', cls:'verdict-cool',
      text: (LANG==='zh')
        ? '偏湿 — 注意排水与根部病害'
        : 'Leaning wetter — watch drainage & root disease' };
  }
  return { icon:'⚖️', cls:'verdict-neutral',
    text: (LANG==='zh')
      ? '雨量接近常年 — 按常规管理'
      : 'Rainfall near normal — manage as usual' };
}

// Expand a 3-letter season code (e.g. "MAM") to plain month names so the
// label carries its own meaning without needing the help card.
var SEAS_MONTHS = {
  DJF:['12','1','2'], JFM:['1','2','3'], FMA:['2','3','4'], MAM:['3','4','5'],
  AMJ:['4','5','6'], MJJ:['5','6','7'], JJA:['6','7','8'], JAS:['7','8','9'],
  ASO:['8','9','10'], SON:['9','10','11'], OND:['10','11','12'], NDJ:['11','12','1']
};
var MON_EN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function seasonPlain(code){
  var m = SEAS_MONTHS[code];
  if (!m) return '';
  if (LANG==='zh') return m[0]+'-'+m[1]+'-'+m[2]+'月';
  return MON_EN[+m[0]]+'-'+MON_EN[+m[1]]+'-'+MON_EN[+m[2]];
}

// Builds the IOD card from the Worker's BOM scrape result {ok,value,asOf}.
// FAILS LOUD: if the scrape is unavailable, or the value is too old, the card
// shows a clear "needs updating" notice instead of any stale/guessed number
// and instead of any rainfall advice. Returns '' only when there's no IOD
// object at all (e.g. very first load offline with no cache).
// Fall back from BoM's weekly figure to the monthly DMI chain.
// The monthly value is NEVER silently substituted: it is flagged monthly:true
// so the card labels it, states its month, and judges its age on a monthly
// yardstick instead of a weekly one.
function withMonthlyIod(iod, dmiText){
  if (iod && iod.ok === true && typeof iod.value === 'number') return iod;
  var m = parseDmiMonthly(dmiText);
  if (!m) return iod;
  return { ok:true, value:m.value, asOf:m.asOf, ym:m.ym, monthly:true,
           bom:(iod && iod.neutral) ? 'neutral' : (iod && iod.reason) || null };
}

function iodCard(iod){
  if (!iod) return '';
  // --- Failure guard: scrape broke (regex missed, BOM down, etc.) ---
  if (!iod.ok || typeof iod.value !== 'number') {
    // Two situations, two messages. "BOM says neutral" is routine reporting;
    // "the scrape broke" needs attention. Both still show no number and give no
    // farm advice -- but only one of them is a fault. The neutral notice needs
    // a date we can age-check: an undated "neutral" could be a year old, so
    // without one we fall back to the loud failure.
    var neutralOk = iod.neutral && iod.asOf && bomDateTs(iod.asOf) > 0
                    && (Date.now() - bomDateTs(iod.asOf)) <= 35*24*3600*1000;
    return '<div class="card">'
      +'<div class="cardtitle"><span class="dot"></span>'+tr('iodTitle')+'</div>'
      +'<div class="cardhint">'+tr('iodHint')+'</div>'
      +(neutralOk
        ? '<div class="iodneutral">'+tr('iodNeutralNoVal').replace('{d}', iod.asOf)+'</div>'
        : '<div class="iodfail">'+tr('iodFail')+'</div>')
    +'</div>';
  }
  var v = iod.value;
  var p = iodPhaseOf(v);
  var pClass = p==='pos' ? 'warm' : p==='neg' ? 'cool' : 'neutral';
  var phaseLbl = p==='pos' ? tr('iodPosCond') : p==='neg' ? tr('iodNegCond') : tr('iodNeuCond');
  var badgeCls = p==='pos' ? 'phase-warm' : p==='neg' ? 'phase-cool' : 'phase-neutral';
  var col = p==='pos' ? 'var(--warm)' : p==='neg' ? 'var(--cool)' : 'var(--ink)';
  var asOfTs = iod.asOf ? bomDateTs(iod.asOf) : 0;
  // A monthly index is EXPECTED to sit a month or two back -- PSL runs about
  // two to three months behind. Judging it by the weekly 35-day rule would
  // permanently mislabel a perfectly normal monthly value as stale, so the
  // yardstick follows the source.
  var maxAge = iod.monthly ? 75 : 35;
  var tooOld = asOfTs > 0 && (Date.now() - asOfTs) > maxAge*24*3600*1000;
  var asOfTxt = iod.asOf ? iod.asOf : '';

  var html = '<div class="card">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('iodTitle')+'</div>'
    +'<div class="cardhint">'+tr('iodHint')+'</div>'
    +'<div class="iodhead">'
      +'<span class="phase-badge '+badgeCls+'">'+phaseLbl+'</span>'
      +'<div class="iodnum" style="color:'+col+'">'+fmt(v)+'</div>'
      +'<div class="anomunit">'+tr('iodUnit')+'</div>'
    +'</div>';
  if (tooOld) {
    // Value present but the source date is stale — flag it (advice withheld
    // in the orchard card too).
    html += '<div class="iodage">'+tr(iod.monthly?'iodAgedMon':'iodAged').replace('{m}', asOfTxt)+'</div>';
  }
  html += '<div class="row" style="margin-top:8px"><span class="k">'+tr('iodLatest')+'</span><span class="v '+pClass+'">'+(asOfTxt?asOfTxt+' · ':'')+fmt(v)+'</span></div>'
    +'<div class="row"><span class="k">'+tr('iodSrc')+'</span><span class="v iodsrc">'
      +(iod.monthly ? 'NOAA PSL' : 'BOM')+'</span></div>'
    +(iod.monthly ? '<div class="iodneutral">'+tr('iodMonthlyNote').replace('{m}', iod.ym||asOfTxt)+'</div>' : '')
  +'</div>';
  return html;
}
// Returns the IOD orchard-advice line for the "what it means" card, or '' if
// IOD is unavailable/stale (so we never give advice off bad data).
function iodFarmLine(iod){
  if (!iod || !iod.ok || typeof iod.value !== 'number') return '';
  var asOfTs = iod.asOf ? bomDateTs(iod.asOf) : 0;
  var maxAge = iod.monthly ? 75 : 35;   // see iodCard: monthly runs further back
  if (asOfTs > 0 && (Date.now() - asOfTs) > maxAge*24*3600*1000) return ''; // stale
  var p = iodPhaseOf(iod.value);
  return p==='pos' ? tr('iodFarmPos') : p==='neg' ? tr('iodFarmNeg') : tr('iodFarmNeu');
}
// Parse a BOM date like "14 June 2026" or "3 May" (no year) into a timestamp.
// If the year is missing, assume the most recent past occurrence.
function bomDateTs(s){
  var MO={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,
          september:8,october:9,november:10,december:11};
  var m = s.match(/(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/);
  if (!m) return 0;
  var day = parseInt(m[1],10);
  var mon = MO[m[2].toLowerCase()];
  if (mon === undefined) return 0;
  var now = new Date();
  var year = m[3] ? parseInt(m[3],10) : now.getFullYear();
  var ts = new Date(year, mon, day).getTime();
  // If no year was given and the date is in the future, it's last year's.
  if (!m[3] && ts > now.getTime()) ts = new Date(year-1, mon, day).getTime();
  return ts;
}

// Builds the MJO card from a parsed RMM row {phase,amp,...}. Shows phase,
// amplitude, the region the MJO sits over, and the plain wet/dry meaning for
// our region. When amplitude < 1 the MJO is inactive: we say so and give no
// rain advice. Returns '' if no MJO data (keeps the rest of the app working).
function mjoCard(mjo){
  if (!mjo) return '';
  // Staleness guard: MJO is DAILY data. If the latest row is well behind today,
  // the source has stopped updating (or lags) — do NOT present old data as
  // "right now". Show the value but flag it and withhold rain advice. Same
  // discipline as the IOD guard: never stale data dressed up as current.
  var dataTs = new Date(mjo.year, mjo.month-1, mjo.day).getTime();
  var ageDays = Math.floor((Date.now() - dataTs) / (24*3600*1000));
  var stale = ageDays > 10;
  var dateTxt = monthName(mjo.month)+' '+mjo.day+', '+mjo.year;

  if (stale){
    // Old data — show it honestly as out of date, no phase advice, no wet/dry.
    return '<div class="card">'
      +'<div class="cardtitle"><span class="dot"></span>'+tr('mjoTitle')+'</div>'
      +'<div class="cardhint">'+tr('mjoHint')+'</div>'
      +'<div class="iodfail">'+tr('mjoStale').replace('{d}', dateTxt).replace('{n}', ageDays)+'</div>'
      +'<div class="row" style="margin-top:8px"><span class="k">'+tr('mjoNowLabel').replace(/[:：]\s*$/,'')+'</span><span class="v" style="font-weight:400;color:var(--muted)">'+dateTxt+'</span></div>'
      +'<div class="row"><span class="k">'+tr('iodSrc')+'</span><span class="v iodsrc">NOAA</span></div>'
    +'</div>';
  }

  var active = mjo.amp >= MJO_ACTIVE;
  var eff = mjoEffect(mjo.phase); // wet/dry/transition
  var badgeCls, badgeLbl, col;
  if (!active){
    badgeCls='phase-neutral'; badgeLbl=tr('mjoWeakBadge'); col='var(--ink)';
  } else if (eff==='wet'){
    badgeCls='phase-cool'; badgeLbl=tr('mjoActiveBadge'); col='var(--cool)';
  } else if (eff==='dry'){
    badgeCls='phase-warm'; badgeLbl=tr('mjoActiveBadge'); col='var(--warm)';
  } else {
    badgeCls='phase-neutral'; badgeLbl=tr('mjoActiveBadge'); col='var(--ink)';
  }
  var meaning = !active ? '' :
    (eff==='wet'?tr('mjoWet'):eff==='dry'?tr('mjoDry'):tr('mjoTrans'));

  var html = '<div class="card">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('mjoTitle')+'</div>'
    +'<div class="cardhint">'+tr('mjoHint')+'</div>'
    +'<div class="iodhead">'
      +'<span class="phase-badge '+badgeCls+'">'+badgeLbl+'</span>'
      +'<div class="iodnum" style="color:'+col+'">'+mjo.phase+'<span style="font-size:18px;font-weight:600;color:var(--muted)"> · '+mjo.amp.toFixed(2)+'</span></div>'
      +'<div class="anomunit">'+tr('mjoUnit')+'</div>'
    +'</div>'
    // The phase wheel (with the 40-day trail) on the home screen, so the phase
    // and its direction of travel are visible without opening the guide.
    +'<div class="mjowheelhome">'+mjoWheel(mjo)+'</div>';
  if (!active){
    html += '<div class="iodage">'+tr('mjoWeakNote')+'</div>';
  } else if (meaning){
    var mc = eff==='wet'?'cool':eff==='dry'?'warm':'';
    html += '<div class="row" style="margin-top:8px"><span class="k">'+tr('mjoRegionLbl')+'</span><span class="v">'+tr(mjoRegionKey(mjo.phase))+'</span></div>'
      +'<div class="row"><span class="k">'+tr('mjoPhaseLbl')+' · '+tr('mjoAmpLbl')+'</span><span class="v '+mc+'">'+tr(eff==='wet'?'mjoWet':eff==='dry'?'mjoDry':'mjoTrans')+'</span></div>';
  }
  html += '<div class="row"><span class="k">'+tr('mjoNowLabel').replace(/[:：]\s*$/,'')+'</span><span class="v" style="font-weight:400;color:var(--muted)">'+dateTxt+'</span></div>'
    +'<div class="row"><span class="k">'+tr('iodSrc')+'</span><span class="v iodsrc">NOAA</span></div>'
  +'</div>';
  return html;
}
// MJO orchard-advice line for the "what it means" card, or '' if inactive,
// stale, or absent (never advice off old data).
function mjoFarmLine(mjo){
  if (!mjo) return '';
  var dataTs = new Date(mjo.year, mjo.month-1, mjo.day).getTime();
  if ((Date.now() - dataTs) / (24*3600*1000) > 10) return ''; // stale -> no advice
  if (mjo.amp < MJO_ACTIVE) return tr('mjoFarmWeak');
  var eff = mjoEffect(mjo.phase);
  var key = eff==='wet'?'mjoFarmWet':eff==='dry'?'mjoFarmDry':'mjoFarmTrans';
  return tr(key).replace('{p}', mjo.phase);
}

// Builds the Monsoon card: seasonal status (NE/SW/inter) + surge index (MSI).
// Surge is a Northeast-Monsoon phenomenon; in other seasons we say "off-season".
function monsoonCard(mon){
  if (!mon) return '';
  // staleness: Open-Meteo daily, so latest day should be ~today.
  var dataTs = mon.date ? new Date(mon.date+'T00:00:00Z').getTime() : 0;
  var stale = dataTs>0 && (Date.now()-dataTs) > 4*24*3600*1000;

  var statusLbl = mon.status==='NE' ? tr('monNE') : mon.status==='SW' ? tr('monSW') : tr('monInter');
  var statusCls = mon.status==='NE' ? 'phase-cool' : mon.status==='SW' ? 'phase-warm' : 'phase-neutral';

  // surge only meaningful in NE monsoon
  var surgeSeason = (mon.status==='NE');
  var surgeActive = surgeSeason && mon.surge;
  var msiTxt = (typeof mon.msi==='number') ? mon.msi.toFixed(1)+' m/s' : '—';

  var html = '<div class="card">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('monTitle')+'</div>'
    +'<div class="cardhint">'+tr('monHint')+'</div>'
    +'<div style="text-align:center;margin:8px 0 2px">'
      +'<span class="phase-badge '+statusCls+'">'+statusLbl+'</span>'
    +'</div>';

  if (stale){
    html += '<div class="iodage">'+tr('monStale')+'</div>';
  } else if (surgeActive){
    // active surge — the high-alert state
    html += '<div class="surgealert">'+tr('monSurgeOn').replace('{v}', msiTxt)+'</div>';
  } else if (surgeSeason){
    // NE season, no surge currently
    html += '<div class="verdict verdict-neutral" style="margin-top:12px;border-radius:10px;border:none">'+tr('monSurgeOff').replace('{v}', msiTxt)+'</div>';
  } else {
    // not NE season — surge not applicable
    html += '<div class="cardhint" style="margin:10px 0 0">'+tr('monSurgeNA')+'</div>';
  }

  // detail rows
  html += '<div class="row" style="margin-top:8px"><span class="k">'+tr('monStatusLbl')+'</span><span class="v">'+statusLbl+'</span></div>';
  if (surgeSeason){
    html += '<div class="row"><span class="k">'+tr('monMsiLbl')+'</span><span class="v '+(surgeActive?'cool':'')+'">'+msiTxt+'</span></div>';
  }
  html += '<div class="row"><span class="k">'+tr('monSrc')+'</span><span class="v iodsrc">Open-Meteo · 925 hPa</span></div>'
    +'<div class="monofficial">'+tr('monOfficial')+'</div>'
  +'</div>';
  return html;
}
// Monsoon orchard-advice line, or '' if no data/stale.
function monsoonFarmLine(mon){
  if (!mon) return '';
  var dataTs = mon.date ? new Date(mon.date+'T00:00:00Z').getTime() : 0;
  if (dataTs>0 && (Date.now()-dataTs) > 4*24*3600*1000) return '';
  if (mon.status==='NE' && mon.surge) return tr('monFarmSurge');
  if (mon.status==='NE') return tr('monFarmNE');
  if (mon.status==='SW') return tr('monFarmSW');
  return tr('monFarmInter');
}
