// Cross-section of the equatorial Pacific showing the Walker Circulation in the
// EL NIÑO state: Malaysia (left) under the sinking/dry branch, warm water and
// the rising/rainy branch shifted east to the central Pacific. The closed loop
// arrows make the "see-saw" visible. Pure SVG, offline.
function walkerDiagram(){  var t=function(k){return tr(k);};
  var W=320, H=210;
  var oceanY=150, skyTop=30;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="ninomap" role="img" aria-label="Walker circulation">';
  // sky + ocean
  svg+='<rect x="0" y="0" width="'+W+'" height="'+oceanY+'" fill="#eff6ff" rx="6"/>';
  svg+='<rect x="0" y="'+oceanY+'" width="'+W+'" height="'+(H-oceanY)+'" fill="#dbeafe"/>';
  // warm pool shifted east (right side), cooler water west (left)
  svg+='<rect x="150" y="'+oceanY+'" width="150" height="'+(H-oceanY)+'" fill="#fecaca" opacity="0.7"/>';
  svg+='<text x="225" y="'+(oceanY+34)+'" font-size="8.5" fill="#b91c1c" text-anchor="middle">'+t('walkerWarm')+'</text>';
  // circulation loop (rectangle-ish with arrows): rise east, flow west aloft,
  // sink west (over Malaysia), flow east at surface.
  var loopTop=skyTop+8, loopL=48, loopR=250;
  // rising branch (east / right) — up arrow
  svg+='<line x1="'+loopR+'" y1="'+(oceanY-6)+'" x2="'+loopR+'" y2="'+loopTop+'" stroke="#1d4ed8" stroke-width="3"/>';
  svg+='<polygon points="'+loopR+','+(loopTop-2)+' '+(loopR-5)+','+(loopTop+8)+' '+(loopR+5)+','+(loopTop+8)+'" fill="#1d4ed8"/>';
  // top branch (right -> left)
  svg+='<line x1="'+loopR+'" y1="'+loopTop+'" x2="'+loopL+'" y2="'+loopTop+'" stroke="#93c5fd" stroke-width="3"/>';
  svg+='<polygon points="'+loopL+','+loopTop+' '+(loopL+9)+','+(loopTop-5)+' '+(loopL+9)+','+(loopTop+5)+'" fill="#93c5fd"/>';
  // sinking branch (west / left, over Malaysia) — down arrow
  svg+='<line x1="'+loopL+'" y1="'+loopTop+'" x2="'+loopL+'" y2="'+(oceanY-6)+'" stroke="#a16207" stroke-width="3"/>';
  svg+='<polygon points="'+loopL+','+(oceanY-4)+' '+(loopL-5)+','+(oceanY-14)+' '+(loopL+5)+','+(oceanY-14)+'" fill="#a16207"/>';
  // surface return (left -> right)
  svg+='<line x1="'+loopL+'" y1="'+(oceanY-6)+'" x2="'+loopR+'" y2="'+(oceanY-6)+'" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>';
  // rain under rising branch (east)
  for (var i=0;i<4;i++){
    var rx=loopR-18+i*10;
    svg+='<line x1="'+rx+'" y1="'+(oceanY-30)+'" x2="'+(rx-3)+'" y2="'+(oceanY-14)+'" stroke="#2563eb" stroke-width="1.5"/>';
  }
  svg+='<text x="'+loopR+'" y="'+(loopTop+22)+'" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'+t('walkerRise')+'</text>';
  // dry sun over sinking branch (west, Malaysia)
  svg+='<circle cx="'+loopL+'" cy="'+(loopTop+26)+'" r="7" fill="#f59e0b"/>';
  svg+='<text x="'+loopL+'" y="'+(loopTop+48)+'" font-size="8.5" font-weight="bold" fill="#a16207" text-anchor="middle">'+t('walkerSink')+'</text>';
  // location labels under the ocean
  svg+='<text x="'+loopL+'" y="'+(H-8)+'" font-size="9" font-weight="bold" fill="#0f766e" text-anchor="middle">★ '+t('walkerMY')+'</text>';
  svg+='<text x="'+loopR+'" y="'+(H-8)+'" font-size="8.5" fill="#334155" text-anchor="middle">'+t('walkerN34')+'</text>';
  svg+='</svg>';
  return svg;
}

// MJO phase wheel: the standard 8-phase RMM diagram. Highlights the current
// phase, marks the Maritime Continent (phases 4-5, "us"), and plots the
// current (RMM1,RMM2) point. mjo = parsed row or null.
function mjoWheel(mjo){  var t = function(k){ return tr(k); };
  var cx=150, cy=130, R=92, rIn=26;   // wider box: the side labels need room
  function pol(ang,r){ var a=ang*Math.PI/180; return [cx+r*Math.cos(a), cy - r*Math.sin(a)]; }
  function wedge(a0,a1,fill){
    var p0=pol(a0,rIn), p1=pol(a0,R), p2=pol(a1,R), p3=pol(a1,rIn);
    return '<path d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)
      +'L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)
      +'A'+R+' '+R+' 0 0 0 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)
      +'L'+p3[0].toFixed(1)+' '+p3[1].toFixed(1)
      +'A'+rIn+' '+rIn+' 0 0 1 '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)
      +'Z" fill="'+fill+'" stroke="#cbd5e1" stroke-width="0.7"/>';
  }
  // phase -> [startAngle,endAngle] in math degrees (CCW), WH04 convention
  var PH={1:[180,225],2:[225,270],3:[270,315],4:[315,360],5:[0,45],6:[45,90],7:[90,135],8:[135,180]};
  var cur = mjo ? mjo.phase : 0;
  var active = mjo && mjo.amp>=1;
  // viewBox tall enough for the bottom region label to sit clear of the edge
  var svg='<svg viewBox="0 0 300 284" class="ninomap" role="img" aria-label="MJO phase wheel">';
  for (var ph=1; ph<=8; ph++){
    var a=PH[ph];
    var fill='#f1f5f9';
    if (ph===4||ph===5) fill='#fef9c3';                 // Maritime band (us)
    if (ph===cur){
      var e=mjoEffect(ph);
      if (active){
        // strong: full effect colour
        fill = e==='wet'?'#bfdbfe':e==='dry'?'#fecaca':'#e2e8f0';
      } else {
        // weak: faint tint of the effect colour, so the current phase is still
        // legible without implying the MJO is strong.
        fill = e==='wet'?'#eff6ff':e==='dry'?'#fef2f2':'#f8fafc';
        if (ph===4||ph===5) fill='#fef9c3'; // keep Maritime tint if current+weak
      }
    }
    svg+=wedge(a[0],a[1],fill);
    var mid=(a[0]+a[1])/2, lp=pol(mid,(R+rIn)/2);
    svg+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">'+ph+'</text>';
  }
  // amplitude=1 inner circle (the "active" threshold). Label sits on its lower
  // rim (not dead-center) so the plotted point never collides with the text.
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rIn+'" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>';
  svg+='<text x="'+cx+'" y="'+(cy+rIn-5)+'" font-size="7" fill="#94a3b8" text-anchor="middle">amp 1</text>';
  // Region labels around the ring. These MUST match the wedge angles above:
  // phases 4-5 (Maritime Continent, us) sit on the RIGHT, 6-7 top, 8-1 left,
  // 2-3 bottom. They were previously rotated a quadrant, so the wheel said the
  // Maritime Continent was at the bottom where phases 2-3 actually are — the
  // opposite of what the same app's advice text and yellow band both say.
  svg+='<text x="'+cx+'" y="18" font-size="8.5" fill="#64748b" text-anchor="middle">'+t('mjoRegWPac')+'</text>';          // 6-7
  svg+='<text x="'+cx+'" y="240" font-size="8.5" fill="#64748b" text-anchor="middle">'+t('mjoRegIndian')+'</text>';        // 2-3
  svg+='<text x="4" y="'+(cy-2)+'" font-size="7.5" fill="#64748b" text-anchor="start">'+t('mjoWhHemA')+'</text>';          // 8-1
  svg+='<text x="4" y="'+(cy+9)+'" font-size="7.5" fill="#64748b" text-anchor="start">'+t('mjoWhHemB')+'</text>';
  svg+='<text x="296" y="'+(cy-2)+'" font-size="7.5" font-weight="bold" fill="#a16207" text-anchor="end">'+t('mjoWhMarA')+'</text>';  // 4-5 (us)
  svg+='<text x="296" y="'+(cy+9)+'" font-size="7.5" font-weight="bold" fill="#a16207" text-anchor="end">'+t('mjoWhMarB')+'</text>';
  // Written key: the picture and the words now have to agree, and a reader who
  // misreads the ring can still get the mapping right.
  svg+='<text x="'+cx+'" y="264" font-size="7" fill="#94a3b8" text-anchor="middle">'+t('mjoWhKey1')+'</text>';
  svg+='<text x="'+cx+'" y="276" font-size="7" fill="#94a3b8" text-anchor="middle">'+t('mjoWhKey2')+'</text>';
  // plot current point: amplitude maps so amp=1 sits at the rIn ring, growing
  // outward toward R at amp~3. Weak MJO (<1) therefore sits inside the dashed
  // ring, which visually reads as "inactive".
  if (mjo){
    var rPlot = rIn + (mjo.amp - 1) * ((R - rIn) / 2); // amp1->rIn, amp3->R
    if (rPlot < 4) rPlot = 4;                           // keep off exact center
    if (rPlot > R) rPlot = R;
    // 40-day trail: the MJO's recent path through phase space. Drawn faint so
    // the current point stays dominant; shows direction of travel (the MJO
    // circles counterclockwise when propagating eastward).
    if (mjo.track && mjo.track.length > 1){
      var pts = [];
      for (var ti=0; ti<mjo.track.length; ti++){
        var tp = mjo.track[ti];
        var tr_ = rIn + (tp.amp - 1) * ((R - rIn) / 2);
        if (tr_ < 4) tr_ = 4; if (tr_ > R) tr_ = R;
        var ta = Math.atan2(tp.rmm2, tp.rmm1);
        pts.push((cx + tr_*Math.cos(ta)).toFixed(1)+','+(cy - tr_*Math.sin(ta)).toFixed(1));
      }
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#0f766e" stroke-width="1.3" opacity="0.3" stroke-linejoin="round"/>';
      // small hollow marker at the trail start (oldest point) for orientation
      var p0 = pts[0].split(',');
      svg+='<circle cx="'+p0[0]+'" cy="'+p0[1]+'" r="2.5" fill="none" stroke="#0f766e" stroke-width="1" opacity="0.4"/>';
    }
    // direction from the RMM vector angle
    var ang = Math.atan2(mjo.rmm2, mjo.rmm1); // radians, CCW from +x
    var px = cx + rPlot*Math.cos(ang), py = cy - rPlot*Math.sin(ang);
    // faint line from centre to the dot — shows which way the MJO points even
    // when the amplitude is small and the dot huddles near the middle.
    var lx = cx + (rPlot+6)*Math.cos(ang), ly = cy - (rPlot+6)*Math.sin(ang);
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+lx.toFixed(1)+'" y2="'+ly.toFixed(1)+'" stroke="#0f766e" stroke-width="1.5" opacity="0.45"/>';
    svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="5" fill="#0f766e" stroke="#fff" stroke-width="1.5"/>';
  }
  svg+='</svg>';
  return svg;
}

// Simple seasonal diagram: the ITCZ rain-band's three positions through the
// year (north / overhead / south) relative to Malaysia's fixed latitude.
// Concept illustration only — not live data. Highlights the current season's
// band based on the month.
function itczDiagram(){  var t=function(k){return tr(k);};
  var m = (new Date()).getUTCMonth()+1;
  // which band is "active" now: N (Jul-Aug-ish SW), mid (inter), S (NE)
  var active;
  if (m>=6 && m<=9) active='N';
  else if (m===12||m===1||m===2) active='S';
  else active='MID'; // Mar-May, Oct-Nov transitions
  var W=300, H=210;
  function band(y, col, on){
    // a wavy rain-band line across the width
    var d='M10 '+y;
    for (var x=10;x<=W-10;x+=20){ d+=' Q'+(x+10)+' '+(y-6)+' '+(x+20)+' '+y; }
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(on?5:3)+'" '
      +'opacity="'+(on?1:0.35)+'" stroke-linecap="round"/>';
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="ninomap" role="img" aria-label="ITCZ seasonal diagram">';
  // sky background
  svg+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#f0f9ff" rx="8"/>';
  // Malaysia latitude line (fixed, middle-ish)
  var myY=120;
  svg+='<line x1="10" y1="'+myY+'" x2="'+(W-10)+'" y2="'+myY+'" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 3"/>';
  svg+='<text x="'+(W-12)+'" y="'+(myY+13)+'" font-size="9" font-weight="bold" fill="#0f766e" text-anchor="end">★ '+t('itczMY')+'</text>';
  // three band positions: north (y=55), overhead (y=120), south (y=180)
  svg+=band(55,  '#3b82f6', active==='N');
  svg+='<text x="34" y="42" font-size="8.5" fill="'+(active==='N'?'#1e3a8a':'#64748b')+'" font-weight="'+(active==='N'?'bold':'normal')+'">'+t('itczLabelN')+'</text>';
  svg+=band(myY, '#1d4ed8', active==='MID');
  svg+='<text x="34" y="'+(myY-10)+'" font-size="8.5" fill="'+(active==='MID'?'#1e3a8a':'#64748b')+'" font-weight="'+(active==='MID'?'bold':'normal')+'">'+t('itczLabelMid')+'</text>';
  svg+=band(180, '#3b82f6', active==='S');
  svg+='<text x="34" y="167" font-size="8.5" fill="'+(active==='S'?'#1e3a8a':'#64748b')+'" font-weight="'+(active==='S'?'bold':'normal')+'">'+t('itczLabelS')+'</text>';
  // small sun marker drifting with the active band
  var sunY = active==='N'?55:active==='S'?180:myY;
  svg+='<circle cx="22" cy="'+sunY+'" r="6" fill="#f59e0b"/>';
  svg+='</svg>';
  return svg;
}

/* ===================== FETCH ===================== */
function getFeed(name){
  // Append a timestamp so neither the browser nor the Worker's edge cache can
  // serve a stale copy — each load requests a unique URL.
  var bust = '&t=' + Date.now();
  return fetch(PROXY + '?feed=' + name + bust, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(name+' '+r.status); return r.text(); });
}

// ===================== MONSOON (status + surge index) =====================
// Computed from Open-Meteo 925-hPa winds, called directly from the app.
//
// MSI (Meridional Surge Index, MetMalaysia / Chang 2005): the average 925-hPa
// meridional (north-south) wind over 110-117.5E along 15N. A surge episode is
// MSI < -8 m/s for 3 consecutive days (strong cold northerly push from the SCS).
//
// Monsoon status: Northeast monsoon ~Nov-Mar, Southwest ~late May-Sep, with
// inter-monsoon between. We confirm with the 925-hPa wind direction over the
// Malaysian region so the label reflects the actual flow, not just the calendar.
var MSI_LON = [110, 112.5, 115, 117.5]; // sample points along 15N
var MSI_LAT = 15;
var SURGE_THRESH = -8;   // m/s
var SURGE_DAYS = 3;      // consecutive days
// meridional (northward +) component from speed + met direction (FROM)
function vWind(speed, dirDeg){ return -speed * Math.cos(dirDeg*Math.PI/180); }
function uWind(speed, dirDeg){ return -speed * Math.sin(dirDeg*Math.PI/180); }

function fetchMonsoon(){
  // Pressure-level winds are HOURLY only on Open-Meteo (no daily aggregates),
  // so we request hourly 925-hPa wind and average to daily MSI ourselves.
  var lats = MSI_LON.map(function(){ return MSI_LAT; }).concat([3.8]);  // +Triang-ish
  var lons = MSI_LON.concat([102.4]);
  var base = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + lats.join(',')
    + '&longitude=' + lons.join(',')
    + '&hourly=wind_speed_925hPa,wind_direction_925hPa'
    + '&wind_speed_unit=ms&timezone=UTC&past_days=7&forecast_days=1';
  return fetch(base, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('open-meteo '+r.status); return r.json(); })
    .then(function(j){
      var arr = Array.isArray(j) ? j : [j];
      if (arr.length < MSI_LON.length+1) throw new Error('monsoon: missing points');
      var times = arr[0].hourly.time;          // hourly ISO timestamps
      // Group hourly indices by calendar day (UTC date string).
      var dayKeys = [];                         // ordered unique dates
      var dayIdx = {};                          // date -> [hourly indices]
      for (var h=0; h<times.length; h++){
        var dkey = times[h].slice(0,10);
        if (!dayIdx[dkey]){ dayIdx[dkey]=[]; dayKeys.push(dkey); }
        dayIdx[dkey].push(h);
      }
      // Daily MSI = mean over box points of the daily-mean V-wind.
      var msiByDay = dayKeys.map(function(dk){
        var idxs = dayIdx[dk], sum=0, cnt=0;
        for (var k=0; k<MSI_LON.length; k++){
          var sp = arr[k].hourly.wind_speed_925hPa;
          var di = arr[k].hourly.wind_direction_925hPa;
          // daily-mean V for this point
          var vsum=0, vcnt=0;
          for (var t=0;t<idxs.length;t++){
            var ii=idxs[t];
            if (sp[ii]==null || di[ii]==null) continue;
            vsum += vWind(sp[ii], di[ii]); vcnt++;
          }
          if (vcnt){ sum += vsum/vcnt; cnt++; }
        }
        return cnt ? sum/cnt : null;
      });
      // surge = MSI < threshold for >= SURGE_DAYS consecutive days (latest run)
      var run=0, surgeNow=false, latestMSI=null;
      for (var i=0;i<msiByDay.length;i++){
        if (msiByDay[i]==null){ run=0; continue; }
        latestMSI = msiByDay[i];
        if (msiByDay[i] < SURGE_THRESH){ run++; if (run>=SURGE_DAYS) surgeNow=true; }
        else run=0;
      }
      // status wind: daily-mean direction over the Malaysia point, latest day
      var mp = arr[MSI_LON.length].hourly;
      var lastDay = dayKeys[dayKeys.length-1];
      var lidx = dayIdx[lastDay];
      var usum=0, vsum=0, scnt=0, spdSum=0;
      for (var q=0;q<lidx.length;q++){
        var jj=lidx[q];
        var s=mp.wind_speed_925hPa[jj], d=mp.wind_direction_925hPa[jj];
        if (s==null||d==null) continue;
        usum += uWind(s,d); vsum += vWind(s,d); spdSum += s; scnt++;
      }
      var mDir=null, mSpeed=null;
      if (scnt){
        // mean direction from mean U/V (vector mean), met "from" convention
        mDir = (Math.atan2(-usum/scnt, -vsum/scnt) * 180/Math.PI + 360) % 360;
        mSpeed = spdSum/scnt;
      }
      var status = monsoonStatus(new Date(), mDir);
      return {
        msi: latestMSI, surge: surgeNow, surgeRun: run,
        status: status, windDir: mDir, windSpeed: mSpeed,
        date: lastDay, asOf: lastDay
      };
    });
}
// Determine monsoon phase from the calendar. NOTE: purely calendar-based —
// NE ~Nov-Mar, SW ~Jun-Sep, inter-monsoon between (Apr-May, Oct). The 925-hPa
// wind direction is fetched and returned alongside (mon.windDir) for reference
// but is NOT used to override the season label, to avoid the label flapping
// day-to-day on transient winds. dir param kept for future refinement.
function monsoonStatus(now, dir){
  var m = now.getUTCMonth()+1; // 1-12
  if (m===11||m===12||m===1||m===2||m===3) return 'NE';
  if (m>=6 && m<=9) return 'SW';
  return 'INTER'; // Apr-May, Oct transitions
}

function load(){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading" id="loading"><div class="spinner"></div><div>'
    + tr('loading') + '</div></div>';
  // IOD and MJO are bonus feeds: if either fails we still show ENSO. Their
  // fetches never reject the whole Promise.all — they resolve to null on failure.
  var iodFeed = getFeed('iod').catch(function(){ return null; });
  var mjoFeed = getFeed('mjo').catch(function(){ return null; });
  // Monsoon status + surge index: computed from Open-Meteo 925-hPa winds,
  // fetched directly (not via the Worker). Also a bonus — null on failure.
  var monFeed = fetchMonsoon().catch(function(){ return null; });
  var outFeed = getFeed('outlook').catch(function(){ return null; });
  // Monthly DMI: only ever used if BoM has no weekly figure. Bonus feed, so a
  // failure resolves to null rather than taking the whole load down.
  var dmiFeed = getFeed('dmimon').catch(function(){ return null; });
  sstLoad();   // fire and forget: the map works fine without it
  Promise.all([ getFeed('roni'), getFeed('weekly'), iodFeed, mjoFeed, monFeed, outFeed, dmiFeed ])
    .then(function(res){
      var roni = parseSeasonal(res[0], 2);   // RONI anom in col 2
      var weekly = parseWeekly(res[1]);
      if (!roni.length || !weekly.length) throw new Error('empty parse');
      // IOD comes back as JSON {ok,value,asOf} from the Worker's BOM scrape.
      // BoM weekly first; the monthly chain only fills in when BoM gives us
      // no usable figure (event over, wording changed, Worker down).
      var iod = withMonthlyIod(parseIod(res[2]), res[6]);
      var mjo = parseMJO(res[3]);
      var mon = res[4]; // already a computed object (or null)
      var out = parseOutlook(res[5]);
      // Save the fresh feeds so the app can show them next time it's offline.
      try {
        localStorage.setItem('enso-cache', JSON.stringify({
          roni: res[0], weekly: res[1], iod: res[2] || '', mjo: res[3] || '',
          mon: mon || null, out: res[5] || '', dmimon: res[6] || '', at: Date.now()
        }));
      } catch(e){ /* storage full or blocked — ignore */ }
      render(roni, weekly, null, iod, mjo, mon, out);
    })
    .catch(function(e){
      // Fetch failed (likely offline). Fall back to the last-saved data.
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem('enso-cache') || 'null'); } catch(_){}
      if (raw && raw.roni && raw.weekly) {
        var roni = parseSeasonal(raw.roni, 2);
        var weekly = parseWeekly(raw.weekly);
        var iod = withMonthlyIod(parseIod(raw.iod), raw.dmimon);
        var mjo = parseMJO(raw.mjo);
        var out = parseOutlook(raw.out);
        if (roni.length && weekly.length) { render(roni, weekly, raw.at, iod, mjo, raw.mon||null, out); return; }
      }
      renderError(e); // no cache to fall back on
    });
}
// Parse the Worker's IOD JSON. Returns {ok,value,asOf} on success, or
// {ok:false} on any problem — the card uses ok:false to show a loud notice.
// Monthly DMI parser. Handles BOTH shapes the Worker's dmimon chain can
// return: PSL CSV rows (YYYY-MM-01, value) and the PSL standard format
// (year followed by 12 monthly values). -9999 is the missing flag; PSL pads
// the rest of the current year with it, so "last row" is not "last value".
// Ported from SUHU's latestMonthly(), widened for the CSV shape.
function parseDmiMonthly(text){
  if (!text || text.charAt(0) === '{') return null;   // 502 JSON, not data
  var best = null, lines = String(text).replace(/<[^>]+>/g,' ').split(/\r?\n/);
  function keep(y, m, v){
    if (!isFinite(v) || v <= -90 || v >= 90) return;   // missing flag
    if (!best || y > best.year || (y === best.year && m > best.month))
      best = { year:y, month:m, value:v };
  }
  for (var i=0;i<lines.length;i++){
    var ln = lines[i].trim();
    if (!ln) continue;
    var csv = ln.match(/^(\d{4})-(\d{2})-\d{2}\s*,\s*(-?\d+(?:\.\d+)?)/);
    if (csv){ keep(+csv[1], +csv[2], parseFloat(csv[3])); continue; }
    var toks = ln.split(/\s+/).map(Number);
    if (toks.length < 2) continue;
    var yr = toks[0];
    if (!Number.isInteger(yr) || yr < 1870 || yr > 2100) continue;
    toks.slice(1,13).forEach(function(v,k){ keep(yr, k+1, v); });
  }
  if (!best) return null;
  var MN = ['January','February','March','April','May','June','July',
            'August','September','October','November','December'];
  return {
    value: best.value,
    ym: best.year + '-' + (best.month<10?'0':'') + best.month,
    // Dated mid-month so the existing bomDateTs()/age machinery works unchanged.
    asOf: '15 ' + MN[best.month-1] + ' ' + best.year
  };
}

function parseIod(text){
  if (!text) return { ok:false };
  try {
    var o = (typeof text === 'string') ? JSON.parse(text) : text;
    if (o && o.ok === true && typeof o.value === 'number') {
      return { ok:true, value:o.value, asOf:o.asOf || null };
    }
    // BOM only quotes a figure while an IOD event is running. When they say
    // "neutral" in prose with no number, that is the source reporting normally
    // -- not our regex breaking. The Worker distinguishes the two; carry the
    // distinction through so the card can say which one happened.
    if (o && o.neutral === true) {
      return { ok:false, neutral:true, asOf:o.asOf || null, reason:'neutral, no figure' };
    }
    return { ok:false, reason:(o && o.reason) || 'no data' };
  } catch(e){ return { ok:false, reason:'bad json' }; }
}
// Parse the Worker's CPC outlook JSON {ok,status,synopsis,issued}. Returns
// null on any problem or if the issue date is >45 days old (monthly product) —
// the outlook row is a bonus and is simply omitted rather than shown stale.
function parseOutlook(text){
  if (!text) return null;
  try {
    var o = (typeof text === 'string') ? JSON.parse(text) : text;
    if (!o || o.ok !== true || !o.status) return null;
    if (o.issued){
      var ts = bomDateTs(o.issued); // same "9 July 2026" format
      if (ts > 0 && (Date.now() - ts) > 45*24*3600*1000) return null; // stale
    }
    return { status:o.status, synopsis:o.synopsis || null,
             synopsisZh:o.synopsisZh || null, issued:o.issued || null };
  } catch(e){ return null; }
}
// Translate the CPC Alert System Status for Chinese mode. This is safe to map
// because the status is a small FIXED official vocabulary (unlike the synopsis,
// which stays in NOAA's original English). Any unrecognised status falls back
// to the English original rather than guessing.
var OUTLOOK_STATUS_ZH = {
  'not active':              '不活跃（无预警）',
  'el nino watch':           '厄尔尼诺观察（酝酿中）',
  'la nina watch':           '拉尼娜观察（酝酿中）',
  'el nino advisory':        '厄尔尼诺警报（已形成）',
  'la nina advisory':        '拉尼娜警报（已形成）',
  'final el nino advisory':  '厄尔尼诺最终警报（消退中）',
  'final la nina advisory':  '拉尼娜最终警报（消退中）'
};
function outlookStatusLabel(status){
  if (LANG !== 'zh' || !status) return status;
  // normalise: lowercase, strip the ñ accent so both "Niño" and "Nino" match
  var key = status.toLowerCase().replace(/\u00f1/g, 'n').replace(/\s+/g, ' ').trim();
  return OUTLOOK_STATUS_ZH[key] || status; // unknown -> English original
}

/* ===================== RENDER ===================== */
// Four small value cells under the map, in CPC's own column order.
// A value is printed only when the weekly row passed the staleness check --
// the map tint and these cells are driven by the same gate, so they cannot
// tell different stories.
function regionCells(wk, stale){
  var defs = [
    {id:'1+2', v:wk.nino12}, {id:'3', v:wk.nino3},
    {id:'3.4', v:wk.nino34, key:true}, {id:'4', v:wk.nino4}
  ];
  return defs.map(function(d){
    var has = !stale && typeof d.v === 'number' && isFinite(d.v);
    var cls = has ? phaseOf(d.v) : '';
    var col = cls==='warm' ? '#dc2626' : cls==='cool' ? '#2563eb' : '#0f172a';
    return '<div class="nreg'+(d.key?' key':'')+'">'
      +'<div class="rk">Niño '+d.id+'</div>'
      +'<div class="rv'+(has?'':' na')+'"'+(has?' style="color:'+col+'"':'')+'>'
      + (has ? fmt(d.v) : '\u2014') +'</div></div>';
  }).join('');
}

function render(roni, weekly, cachedAt, iod, mjo, mon, out){
  var latest = roni[roni.length-1];
  var prev   = roni[roni.length-2] || latest;
  var phase  = phaseOf(latest.anom);
  var strength = strengthOf(latest.anom);

  // 3-season trend
  var t3 = 'steady';
  if (roni.length>=3){
    var d = latest.anom - roni[roni.length-3].anom;
    if (d > 0.1) t3='rising'; else if (d < -0.1) t3='falling';
  }

  var wkLatest = weekly[weekly.length-1];
  var wkPrev   = weekly[weekly.length-2] || wkLatest;

  // Staleness guard: how many weeks behind today is the latest weekly row?
  // CPC updates weekly (Mondays); >3 weeks behind signals a stalled feed or
  // an outdated deployed file. weekTs() gives a ms timestamp from the date.
  var wkAgeWeeks = 0, wkStale = false;
  if (wkLatest.ts){
    wkAgeWeeks = Math.floor((Date.now() - wkLatest.ts) / (7*24*3600*1000));
    wkStale = wkAgeWeeks >= 3;
  }
  // Diagnostic: what did the parser actually receive? Shown only when stale,
  // so we can tell a bad feed (few/old rows) from an app bug.
  var wkDebug = weekly.length + ' rows · ' + weekly[0].date + ' → ' + wkLatest.date;

  // Week-on-week change in Niño 3.4 -- the thing this card exists to show.
  // Withheld entirely when the feed is stale: a delta between two old rows is
  // a real number about the wrong fortnight.
  var wkDelta = wkLatest.nino34 - wkPrev.nino34;
  var wkDeltaTxt, wkDeltaCol;
  if (wkStale){
    wkDeltaTxt = '—'; wkDeltaCol = '#94a3b8';
  } else if (Math.abs(wkDelta) < 0.05){
    wkDeltaTxt = tr('wkSame'); wkDeltaCol = '#475569';
  } else {
    wkDeltaTxt = (wkDelta>0 ? '▲ +' : '▼ −')
               + Math.abs(wkDelta).toFixed(2) + '°C';
    wkDeltaCol = wkDelta>0 ? '#dc2626' : '#2563eb';
  }
  // Last 12 weekly rows as a small spark, same bar geometry as the seasonal one.
  // Greyed out rather than hidden when stale, so the shape still reads but no
  // bar claims to be a current warm/cool signal.
  var wkHist = weekly.slice(-12);
  var wkMax = Math.max(1.0, Math.max.apply(null, wkHist.map(function(h){
                return Math.abs(h.nino34); })));
  var wkBars = wkHist.map(function(h){
    var hpx = Math.max(2, Math.round(Math.abs(h.nino34)/wkMax*22));
    var col = wkStale ? '#cbd5e1'
            : h.nino34>=THRESH ? '#dc2626'
            : h.nino34<=-THRESH ? '#2563eb' : '#cbd5e1';
    return '<div class="bar-cell"><div class="bar '+(h.nino34>=0?'up':'dn')
      +'" style="height:'+hpx+'px;background:'+col+'" title="'+h.date+': '
      +fmt(h.nino34)+'"></div></div>';
  }).join('') + '<div class="zeroline"></div>';
  var wkAxis = wkHist.map(function(h,i){
    return '<span>'+(i%3===0 ? '<b>'+h.date.slice(0,5)+'</b>' : '')+'</span>';
  }).join('');

  // ---- Direction of travel ------------------------------------------------
  // RONI is a 3-month mean published monthly, so the headline necessarily lags
  // the present by ~6 weeks. During onset it reads "weak" while the event is
  // already past that. We qualify it, but ONLY from like-for-like comparisons:
  // t3 is RONI against RONI, wkDelta is weekly against weekly. The two indices
  // are never differenced against each other -- RONI subtracts the tropical
  // mean and the weekly value does not, so the gap between them is a units
  // difference, not a measure of lag. Both trends must agree, or we say nothing.
  var momentum = null;
  if (!wkStale && strength){
    var bothUp   = (t3 === 'rising'  && wkDelta >  0.05);
    var bothDown = (t3 === 'falling' && wkDelta < -0.05);
    if (phase === 'warm') momentum = bothUp ? 'strengthening' : bothDown ? 'weakening' : null;
    if (phase === 'cool') momentum = bothDown ? 'strengthening' : bothUp ? 'weakening' : null;
  }

  var phaseClass = 'phase-'+phase;
  var phaseLabel = phase==='warm'?tr('elnino'):phase==='cool'?tr('lanina'):tr('neutral');
  var phaseCond  = phase==='warm'?tr('elninoCond'):phase==='cool'?tr('laninaCond'):tr('neutralCond');
  var vClass = phase==='warm'?'warm':phase==='cool'?'cool':'neutral';
  var strengthTxt = strength ? tr(strength)+' · '+phaseLabel : tr('neutral');
  if (momentum) strengthTxt += (LANG==='zh' ? '（'+tr(momentum)+'）' : ' · '+tr(momentum));
  var farmKey = phase==='warm'?'farmWarm':phase==='cool'?'farmCool':'farmNeutral';

  // Live, data-driven "right now" sentence (observed state only).
  var nowTxt = situationText(phase, strength, t3, latest.anom, wkLatest.nino34);
  // Stash the inputs so the info-guide overlay can regenerate this live text
  // (and in the current language) whenever it is opened.
  HELP_STATE = { phase:phase, strength:strength, t3:t3,
                 roni:latest.anom, wk:wkLatest.nino34, iod:iod, mjo:mjo, mon:mon, out:out };
  // Always-visible plain verdict for the hero (the 2-second takeaway).
  var verdict = plainVerdict(phase, phaseOf(wkLatest.nino34));
  HELP_STATE.verdictText = verdict.text; // reused by the WhatsApp share

  // spark: last 24 seasons
  var hist = roni.slice(-24);
  var maxAbs = Math.max(1.0, Math.max.apply(null, hist.map(function(h){return Math.abs(h.anom);})));
  // Each bar starts at the zero line and grows toward its sign, so warm and cool
  // seasons are directly comparable. Half the 62px box per side -> 28px max.
  var bars = hist.map(function(h){
    var hpx = Math.max(2, Math.round(Math.abs(h.anom)/maxAbs*28));
    var col = h.anom>=THRESH?'#dc2626':h.anom<=-THRESH?'#2563eb':'#cbd5e1';
    var up = h.anom>=0;
    return '<div class="bar-cell"><div class="bar '+(up?'up':'dn')+'" style="height:'+hpx
      +'px;background:'+col+'" title="'+h.seas+' '+h.yr+': '+fmt(h.anom)+'"></div></div>';
  }).join('') + '<div class="zeroline"></div>';
  var axisLabels = hist.map(function(h,i){
    return '<span>'+(i%4===0?('<b>'+h.seas+'</b><i>\u2019'+h.yr.slice(2)+'</i>'):'')+'</span>';
  }).join('');

  var html =
  (cachedAt
    ? '<div class="offlinebar">'+tr('offlineCache')
      +'<br><span>'+tr('cachedAt')+' '+fmtCacheTime(cachedAt)+'</span></div>'
    : '')
  +'<div class="card status-hero">'
    +'<div class="phase-badge '+phaseClass+'">'+phaseCond+'</div>'
    +'<div class="bignum '+vClass+'" style="color:'+(phase==='warm'?'var(--warm)':phase==='cool'?'var(--cool)':'var(--ink)')+'">'
      +fmt(latest.anom)+'</div>'
    +'<div class="anomunit">'+tr('anomUnit')+'</div>'
    +(strength?'<div class="strength" style="color:'+(phase==='warm'?'var(--warm)':'var(--cool)')+'">'+strengthTxt+'</div>':'')
    +'<div class="phase-desc">RONI · '+latest.seas+' '+latest.yr+' <span class="seas-plain">('+seasonPlain(latest.seas)+')</span></div>'
    +'<div class="herolag">'+tr('heroLag').replace('{s}', latest.seas+' '+latest.yr+' ('+seasonPlain(latest.seas)+')')+'</div>'
    +(out && out.status
        ? '<div class="heroadv">'+tr('heroAdvisory')+'<b>'+outlookStatusLabel(out.status)+'</b>'
          +(out.issued?' <span class="outdate">('+out.issued+')</span>':'')+'</div>'
        : '')
    +'<div class="verdict '+verdict.cls+'"><span class="verdict-i">'+verdict.icon+'</span>'+verdict.text+'</div>'
  +'</div>'

  +'<div class="card">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('roniTitle')+'</div>'
    +'<div class="cardhint">'+tr('helpRoni')+'</div>'
    +'<div class="row"><span class="k">'+tr('latestSeason')+'<br><span class="k-sub">'+seasonPlain(latest.seas)+'</span></span><span class="v '+vClass+'">'+latest.seas+' '+latest.yr+' · '+fmt(latest.anom)+'</span></div>'
    +'<div class="row"><span class="k">'+tr('prevSeason')+'<br><span class="k-sub">'+seasonPlain(prev.seas)+'</span></span><span class="v">'+prev.seas+' '+prev.yr+' · '+fmt(prev.anom)+'</span></div>'
    +'<div class="row"><span class="k">'+tr('trend3')+'</span><span class="v">'+tr(t3)+'</span></div>'
    +(out ? '<div class="row"><span class="k">'+tr('outlookLbl')+'</span><span class="v">'+outlookStatusLabel(out.status)+'</span></div>'
          +(out.synopsis ? '<div class="outsyn">'
              +((LANG==='zh' && out.synopsisZh) ? out.synopsisZh : out.synopsis)
              +(out.issued?' <span class="outdate">('+out.issued+')</span>':'')
              +((LANG==='zh' && out.synopsisZh) ? '<div class="outdate" style="margin-top:4px">'+tr('outlookMT')+'</div>' : '')
            +'</div>' : '')
        : '')
  +'</div>'

  +'<div class="card'+(wkStale?' stale':'')+'">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('weeklyTitle')+'</div>'
    +'<div class="cardhint">'+tr('helpWeekly')+'</div>'
    +(wkStale
      ? '<div class="stalebanner"><b>'+tr('staleWarn')+'</b><br>'
        + tr('staleNote').replace('{n}', wkAgeWeeks)
        + '<br><span class="staledbg">'+wkDebug+'</span></div>'
      : '')
    +'<div class="row"><span class="k">'+tr('nino34')+' · '+tr('week')+' ('+wkLatest.date+')</span><span class="v '+(phaseOf(wkLatest.nino34))+'">'+fmt(wkLatest.nino34)+'°C</span></div>'
    +'<div class="row"><span class="k">'+tr('wkChange')+'<br><span class="k-sub">'+tr('weekAgo')+' ('+wkPrev.date+') '+fmt(wkPrev.nino34)+'°C</span></span>'
      +'<span class="v" style="color:'+wkDeltaCol+'">'+wkDeltaTxt+'</span></div>'
    +'<div class="wktrend">'+tr('wkTrendLbl')+'</div>'
    +'<div class="spark spark-wk">'+wkBars+'</div>'
    +'<div class="axis-row">'+wkAxis+'</div>'
    +'<div class="mapnote">'+tr('wkVsRoni')+'</div>'
    +'<div class="mapnote">'+tr('wkRegionsMoved')+'</div>'
  +'</div>'

  // ---- Monitoring-region map. Same weekly row as the card above, so the
  // ---- boxes and the numbers can never disagree; both go blank when stale.
  +'<div class="card'+(wkStale?' stale':'')+'">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('mapCardTitle')+'</div>'
    +'<div class="cardhint">'+tr('mapCardHint')+'</div>'
    + NinoMap.markup('card')
    +'<div class="nregions">'+ regionCells(wkLatest, wkStale) +'</div>'
    +'<div class="maplegend">'
      +'<span><i style="background:rgb(226,167,163)"></i>'+tr('mapLegWarm')+'</span>'
      +'<span><i style="background:rgb(150,183,243)"></i>'+tr('mapLegCool')+'</span>'
      +'<span><i style="background:#fff;border:2px dashed #f59e0b"></i>'+tr('mapLeg34')+'</span>'
    +'</div>'
    +'<div class="mapnote">'+ (wkStale ? tr('mapStaleNote') : tr('map34Note')) +'</div>'
    +'<div class="mapnote" style="color:#0f766e">● '+tr('mapMY')+' — '+tr('mapMYsub')+'</div>'
  +'</div>'

  + iodCard(iod)
  + mjoCard(mjo)
  + monsoonCard(mon)

  +'<div class="card">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('trendTitle')+'</div>'
    +'<div class="cardhint">'+tr('helpTrend')+'</div>'
    +'<div class="spark">'+bars+'</div>'
    +'<div class="axis-row">'+axisLabels+'</div>'
    +'<div class="legend">'
      +'<span><i style="background:#dc2626"></i>'+tr('elnino')+'</span>'
      +'<span><i style="background:#cbd5e1"></i>'+tr('neutral')+'</span>'
      +'<span><i style="background:#2563eb"></i>'+tr('lanina')+'</span>'
    +'</div>'
  +'</div>'

  +'<div class="card farm">'
    +'<div class="cardtitle"><span class="dot"></span>'+tr('farmTitle')+'</div>'
    +'<p><b>ENSO:</b> '+tr(farmKey)+'</p>'
    +(iodFarmLine(iod)
        ? '<p style="margin-top:9px"><b>IOD:</b> '+iodFarmLine(iod)+'</p>'
        : '')
    +(mjoFarmLine(mjo)
        ? '<p style="margin-top:9px"><b>MJO:</b> '+mjoFarmLine(mjo)+'</p>'
        : '')
    +(monsoonFarmLine(mon)
        ? '<p style="margin-top:9px"><b>'+tr('monShort')+':</b> '+monsoonFarmLine(mon)+'</p>'
        : '')
    +'<p style="font-size:11px;color:#92400e;margin-top:10px">'+tr('disclaimer')+'</p>'
  +'</div>'

  +'<button class="btn ghost" onclick="load()">'+tr('refresh')+'</button>'
  +'<button class="btn wabtn" onclick="shareWA()" aria-label="WhatsApp">'+waIcon()+'</button>'
  +'<div class="swver">'+tr('swBuild')+' <span id="swver">\u2026</span></div>';

  document.getElementById('app').innerHTML = html;

  // Hand the map the same weekly row and the same staleness verdict the cards
  // used. setData() redraws every mounted instance, so the help-guide copy and
  // the card copy always agree.
  NinoMap.setI18n(tr);
  NinoMap.setData(
    { '1+2': wkLatest.nino12, '3': wkLatest.nino3,
      '3.4': wkLatest.nino34, '4': wkLatest.nino4 },
    wkStale, wkLatest.date);
  NinoMap.mount('card');
}

    '<div class="err"><b>'+tr('errTitle')+'</b>'+tr('errBody')
    +'<br><br><code style="font-size:11px;opacity:.7">'+String(e)+'</code></div>'

/* ===================== LANG ===================== */
function applyLang(){
  document.documentElement.lang = LANG;
  // Button always shows the language the UI is currently in.
  document.getElementById('langbtn').textContent = LANG_LBL[LANG];
  document.getElementById('t-title').textContent = tr('title');
  document.getElementById('t-sub').textContent = tr('sub');
}
// Compose a bilingual-aware WhatsApp snapshot of all five signals from
// HELP_STATE (set by render). Signals that are unavailable or stale are simply
// omitted — the share never includes data the cards themselves wouldn't show.
function buildShareText(){
  var s = HELP_STATE;
  if (!s) return '';
  var zh = (LANG==='zh');
  var L = [];
  var d = new Date();
  var dateTxt = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  L.push((zh?'🌊 气候信号快报':'🌊 Climate signals snapshot')+' · '+dateTxt);
  // ENSO
  var phLbl = s.phase==='warm'?tr('elnino'):s.phase==='cool'?tr('lanina'):tr('neutral');
  L.push('ENSO: '+phLbl+' (RONI '+fmt(s.roni)+')');
  if (typeof s.wk==='number') L.push((zh?'每周 Niño3.4: ':'Weekly Niño3.4: ')+fmt(s.wk));
  // IOD (only when good + fresh, same rule as the card)
  if (s.iod && s.iod.ok && typeof s.iod.value==='number'){
    var ip = iodPhaseOf(s.iod.value);
    var ipLbl = ip==='pos'?tr('iodPosCond'):ip==='neg'?tr('iodNegCond'):tr('iodNeuCond');
    var asOfTs = s.iod.asOf ? bomDateTs(s.iod.asOf) : 0;
    if (!(asOfTs>0 && (Date.now()-asOfTs)>35*24*3600*1000)){
      L.push('IOD: '+ipLbl+' ('+fmt(s.iod.value)+')');
    }
  }
  // MJO (skip if stale, mirror the card's guard)
  if (s.mjo){
    var mts = new Date(s.mjo.year, s.mjo.month-1, s.mjo.day).getTime();
    if ((Date.now()-mts)/(24*3600*1000) <= 10){
      if (s.mjo.amp < MJO_ACTIVE){
        L.push('MJO: '+tr('mjoWeakBadge')+' ('+(zh?'位相':'phase')+' '+s.mjo.phase+' · '+s.mjo.amp.toFixed(2)+')');
      } else {
        var me = mjoEffect(s.mjo.phase);
        var meLbl = me==='wet'?tr('mjoWet'):me==='dry'?tr('mjoDry'):tr('mjoTrans');
        L.push('MJO: '+(zh?'位相':'phase')+' '+s.mjo.phase+' · '+s.mjo.amp.toFixed(2)+' — '+meLbl);
      }
    }
  }
  // Monsoon
  if (s.mon){
    var stLbl = s.mon.status==='NE'?tr('monNE'):s.mon.status==='SW'?tr('monSW'):tr('monInter');
    var surgeTxt = (s.mon.status==='NE' && s.mon.surge) ? ' — '+tr('monSurgeShort') : '';
    L.push((zh?'季风: ':'Monsoon: ')+stLbl+surgeTxt);
  }
  // the 2-second takeaway
  if (s.verdictText) L.push((zh?'👉 ':'👉 ')+s.verdictText);
  return L.join('\n');
}
// WhatsApp glyph (white bubble + handset) for the brand-coloured button.
function waIcon(){
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">'
    +'<path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/>'
    +'<path fill="#25D366" d="M9.3 7.4c.2-.4.4-.4.6-.4h.5c.2 0 .4 0 .6.4l.8 1.9c.1.3.1.5-.1.7l-.5.6c-.1.2-.2.4 0 .7.6 1 1.5 1.9 2.6 2.4.3.2.5.1.7-.1l.5-.5c.2-.2.4-.3.7-.2l1.9.9c.4.2.4.4.4.6 0 .3 0 .8-.4 1.2-.4.4-1.3.9-2.2.7-1.7-.4-3.5-1.6-4.9-3.2-1-1.2-1.6-2.6-1.5-3.8 0-.8.2-1.5.3-1.9z"/>'
  +'</svg>';
}
// Open the share preview: the composed text in an editable box, with Send and
// Cancel. The user can adjust the message before it goes to WhatsApp, or back
// out entirely — nothing is sent until they confirm.
function shareWA(){
  var txt = buildShareText();
  if (!txt) return;
  var ov = document.getElementById('shareoverlay');
  ov.innerHTML = '<div class="share-panel" onclick="event.stopPropagation()">'
    +'<div class="share-head">'+tr('sharePrevTitle')+'</div>'
    +'<textarea id="sharetxt" class="share-edit" rows="9"></textarea>'
    +'<div class="share-actions">'
      +'<button class="btn ghost sharecancel" onclick="shareCancel()">'+tr('shareCancel')+'</button>'
      +'<button class="btn wabtn sharesend" onclick="shareSend()">'+waIcon()+' '+tr('shareSend')+'</button>'
    +'</div>'
  +'</div>';
  document.getElementById('sharetxt').value = txt;
  ov.classList.add('show');
}
function shareSend(){
  var el = document.getElementById('sharetxt');
  var txt = el ? el.value.trim() : '';
  shareCancel();
  if (!txt) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}
function shareCancel(){
  var ov = document.getElementById('shareoverlay');
  ov.classList.remove('show');
  ov.innerHTML = '';
}

function toggleLang(){
  // One tap: advance to the next language in the cycle and re-render.
  var i = LANG_CYCLE.indexOf(LANG);
  LANG = LANG_CYCLE[(i + 1) % LANG_CYCLE.length];
  localStorage.setItem('enso-lang', LANG);
  applyLang();
  load();
}

// Builds the info-guide inner HTML. Called fresh on each open so the live
// "right now" situation text reflects current data and language.

// Header info icon: open the guide as a full-screen overlay over everything.
// The main screen stays untouched; closing returns to it unchanged.
function openHelp(){
  var ov = document.getElementById('helpoverlay');
  var body = document.getElementById('helpoverlaybody');
  var title = document.getElementById('helpoverlaytitle');
  if (!ov || !body) return;
  title.textContent = tr('helpToggle');
  body.innerHTML = helpContent();
  body.scrollTop = 0;
  ov.classList.add('show');
  // The canvas only exists once the HTML above is in the DOM, and it can only
  // be measured after the overlay is visible -- so mount on the next frame.
  requestAnimationFrame(function(){ NinoMap.mount('help'); });
  document.body.style.overflow = 'hidden'; // lock background scroll
}
function closeHelp(){
  var ov = document.getElementById('helpoverlay');
  if (!ov) return;
  ov.classList.remove('show');
  document.body.style.overflow = '';
}
// Close when tapping the dark backdrop (but not when tapping the panel).
function helpBackdrop(e){
  if (e.target && e.target.id === 'helpoverlay') closeHelp();
}

/* ===================== BOOT ===================== */
function boot(){
  applyLang();
  NinoMap.setI18n(tr);   // module draws its own labels; give it the translator
  // The fullscreen map lives at body level, outside every scrolling container,
  // so it is never clipped by a card and never fights the page for gestures.
  if (!document.getElementById('nmapfull')){
    var shell = document.createElement('div');
    shell.innerHTML = NinoMap.fullShell();
    document.body.appendChild(shell.firstChild);
  }
  // Escape / Android back-ish: close the map before anything else.
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') NinoMap.closeFull();
  });
  setTimeout(function(){
    var b = document.getElementById('boot');
    if (b) b.style.display='none';
  }, 600);
  load();
}
window.addEventListener('load', boot);
// ---- SST anomaly field -----------------------------------------------------
// Frames are fetched progressively, newest first: the map is usable the moment
// one arrives, and the player appears once there are two. Weekly spacing over
// 12 weeks matches the weekly Nino 3.4 card, so the field and the numbers are
// telling the same story over the same window.
var SST_WEEKS = 12;
function sstLoad(varName){
  if (typeof NinoMap === 'undefined' || !NinoMap.SST) return;
  var v = (varName === 'sst') ? 'sst' : 'anom';
  getFeed('sst&var=' + v + '&date=last').then(function(txt){
    var o = JSON.parse(txt);
    if (!o || o.ok !== true) return;
    if (o.variable !== NinoMap.SST.getVariable()) return;
    NinoMap.SST.addFrame(o);
    NinoMap.sstRow('full');
    // Walk back from the date the SERVER gave us, not from today's date --
    // the feed runs a day or two behind and guessing would ask for frames
    // that do not exist yet.
    var base = Date.parse(o.date + 'T12:00:00Z'), i;
    for (i = 1; i < SST_WEEKS; i++){
      (function(d){
        getFeed('sst&var=' + v + '&date=' + d).then(function(t2){
          var f = JSON.parse(t2);
          // A late reply for a variable the user has since switched away from
          // must be dropped, or it lands in the cleared store and the field
          // ends up half anomaly and half absolute temperature.
          if (f && f.ok === true && f.variable === NinoMap.SST.getVariable()) {
            NinoMap.SST.addFrame(f); NinoMap.sstRow('full');
          }
        }).catch(function(){});
      })(new Date(base - i*7*864e5).toISOString().slice(0,10));
    }
  }).catch(function(){ /* no field today; the boxes still work */ });
}
// Switching variable clears the frame store, so the layer asks us to refill it.
if (typeof NinoMap !== 'undefined' && NinoMap.SST) {
  NinoMap.SST.onNeedFrames(function(v){ sstLoad(v); });
}

// ---- Service worker: register, and actively WATCH for a new build --------
// Registering alone is not enough. The browser only re-checks sw.js on its own
// schedule, so a PWA left open for days can miss a deploy entirely. We check on
// load, whenever the app is brought back to the foreground, whenever the
// network returns, and every 15 minutes while it stays open.
var SW_REG = null, SW_RELOADING = false;

function swShowUpdate(reg, newVer){
  if (document.getElementById('swbar')) return;   // already offered
  var bar = document.createElement('div');
  bar.id = 'swbar';
  bar.className = 'swbar';
  bar.innerHTML = '<span>'+tr('swNew')+'</span>'
    + '<button type="button" id="swgo">'+tr('swReload')+'</button>';
  document.body.appendChild(bar);
  document.getElementById('swgo').onclick = function(){
    this.disabled = true;
    this.textContent = tr('swUpdating');
    // The waiting worker activates, which fires controllerchange below, which
    // reloads. If anything goes wrong, reload anyway after a moment rather
    // than leaving the button spinning forever.
    // Two paths. Normally a worker is already waiting and we just tell it to
    // take over. But the probe can spot a new build BEFORE the browser has
    // installed it, and in that case there is nothing to message -- so kick an
    // update and reload once it lands.
    if (reg && reg.waiting) {
      reg.waiting.postMessage({ type:'SKIP_WAITING' });
    } else if (reg) {
      reg.update().then(function(){
        if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
      }).catch(function(){});
    }
    setTimeout(function(){ if (!SW_RELOADING) location.reload(); }, 2500);
  };
}

if ('serviceWorker' in navigator) {
  // Registered immediately, not on 'load'. This script is at the end of body,
  // so the DOM is ready, and waiting for every image to finish just delays the
  // check on exactly the slow connections where it matters most.
  (function(){
    // updateViaCache:'none' — never let an HTTP-cached copy of sw.js hide a
    // deploy from us.
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function(reg){
        SW_REG = reg;
        if (reg.waiting && navigator.serviceWorker.controller) swShowUpdate(reg);
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            // controller check: on a FIRST ever install there is nothing to
            // update from, so do not nag a new user about a "new version".
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              swShowUpdate(reg);
            }
          });
        });
        swCheck();
        setInterval(swCheck, 15*60*1000);
        document.addEventListener('visibilitychange', function(){
          if (!document.hidden) swCheck();
        });
        window.addEventListener('online', swCheck);
        swReportVersion(reg);
      })
      .catch(function(){ /* ignore: the app works without it */ });
  })();

  // A standalone PWA resumed from bfcache never fires 'load' again, so this is
  // the event that actually matters on a phone.
  window.addEventListener('pageshow', function(ev){ if (ev.persisted) swCheck(); });

  // When the new worker takes control, reload once so the page matches it.
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (SW_RELOADING) return;
    SW_RELOADING = true;
    location.reload();
  });
}

function swCheck(){
  if (SW_REG) SW_REG.update().catch(function(){});
  swProbe();
}

// Ask the SERVER directly what build it is holding.
//
// This exists because the lifecycle route is not dependable on mobile. In a
// standalone PWA the page is often restored from bfcache, so 'load' never fires
// again; iOS throttles reg.update(); and on the launch right after a deploy the
// running page is still the OLD build, whose script has no watcher in it at all
// -- which is why an update needed a second launch to appear. Fetching sw.js
// with cache:'no-store' and reading its version string works regardless of any
// of that: two strings, compared.
var SW_RUNNING = null, SW_OFFERED = null;
function swProbe(){
  fetch('./sw.js?probe=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(txt){
      if (!txt) return;
      var m = txt.match(/CACHE_VERSION\s*=\s*["']([^"']+)["']/);
      if (!m || !SW_RUNNING) return;
      if (m[1] !== SW_RUNNING && SW_OFFERED !== m[1]) {
        SW_OFFERED = m[1];
        swShowUpdate(SW_REG, m[1]);
      }
    })
    .catch(function(){ /* offline: nothing to say */ });
}

// Ask the active worker which build it is and show it in the footer, so a
// device stuck on an old cache is visible instead of a guess.
function swReportVersion(reg){
  var sw = (reg && reg.active) || navigator.serviceWorker.controller;
  if (!sw || typeof MessageChannel === 'undefined') return;
  try {
    var ch = new MessageChannel();
    ch.port1.onmessage = function(e){
      var el = document.getElementById('swver');
      if (e.data && e.data.version) {
        SW_RUNNING = e.data.version;
        if (el) el.textContent = e.data.version;
        swProbe();          // now that we know what is running, compare it
      }
    };
    sw.postMessage({ type:'VERSION' }, [ch.port2]);
  } catch (err) { /* not important enough to fail anything */ }
}
// safety: never let boot screen stick
setTimeout(function(){var b=document.getElementById('boot');if(b)b.style.display='none';},12000);
</script>
